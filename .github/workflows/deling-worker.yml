name: Deling – server

# Lægger serveren til Fil/Billede deling på Cloudflare (Worker + R2) og skriver dens adresse i deling/config.json.
# Kræver tre hemmeligheder i repoet: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID og DELING_KEY (din afsenderkode).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deling/worker/**', '.github/workflows/deling-worker.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: deling-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DELING_KEY: ${{ secrets.DELING_KEY }}
    steps:
      - name: Tjek hemmeligheder
        id: chk
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$DELING_KEY" ]; then
            echo "::notice::Mangler CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID eller DELING_KEY under Settings → Secrets and variables → Actions. Springer over."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-node@v4
        if: steps.chk.outputs.skip != '1'
        with:
          node-version: 22
      - name: Opret R2-bucket (hvis den mangler)
        if: steps.chk.outputs.skip != '1'
        working-directory: deling/worker
        run: |
          npx -y wrangler@4 r2 bucket create deling 2>&1 | tee bucket.txt || true
          if grep -qi "enable R2\|10042" bucket.txt; then echo "::error::R2 er ikke slået til på Cloudflare-kontoen. Gå til R2 i Cloudflare og slå det til (gratis op til 10 GB)."; exit 1; fi
      - name: Udgiv Worker
        if: steps.chk.outputs.skip != '1'
        working-directory: deling/worker
        run: npx -y wrangler@4 deploy 2>&1 | tee deploy.txt
      - name: Sæt afsenderkode
        if: steps.chk.outputs.skip != '1'
        working-directory: deling/worker
        run: printf '%s' "$DELING_KEY" | npx -y wrangler@4 secret put UPLOAD_KEY
      - name: Gem adressen i appen
        if: steps.chk.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deling/worker/deploy.txt | head -1)
          if [ -z "$url" ]; then echo "::error::Fandt ikke Workerens adresse. Har kontoen et workers.dev-underdomæne? Åbn Workers & Pages i Cloudflare én gang."; exit 1; fi
          echo "Adresse: $url"
          printf '{"api": "%s"}\n' "$url" > deling/config.json
          if ! git diff --quiet deling/config.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
            git add deling/config.json
            git commit -m "Deling: serveradresse"
            git push
            # Udgiv siden igen med den nye adresse
            gh workflow run kursvagt.yml --ref main
          fi
