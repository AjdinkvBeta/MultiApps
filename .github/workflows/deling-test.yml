name: Deling – test

# Manuel test: to browsere forbindes via den offentlige PeerJS-server og sender filer begge veje.
on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Kun Begivenheder'
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm i --no-save playwright@1.48.2 http-server@14.1.1 && npx playwright install --with-deps chromium
      # Resultatet læses i loggen ("fejl: ingen"); kørslen markeres ikke som fejlet, så der ikke sendes mail
      - continue-on-error: true
        env:
          ONLY: ${{ inputs.only }}
        run: (npx http-server -p 8080 -c-1 -s . &) && sleep 2 && if [ "$ONLY" = "musik" ]; then node .github/tests/musik.cjs; elif [ "${ONLY%% *}" = "sep" ]; then (while true; do ps -eo rss,args | grep -i chrom | grep -v grep | awk '{s+=$1; if($1>m)m=$1} END{print "RSS i alt MB", int(s/1024), "største proces MB", int(m/1024)}' >> /tmp/mem.log; sleep 1; done &) ; DUR=${DUR:-60} CFGS="${ONLY#sep }" node .github/tests/musik-sep.cjs; sort -t" " -k4 -n /tmp/mem.log | tail -1; sort -t" " -k7 -n /tmp/mem.log | tail -1; else node .github/tests/begivenheder.cjs && ([ -n "$ONLY" ] || node .github/tests/deling.cjs); fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skaermbilleder
          path: '*.png'
          if-no-files-found: ignore
