name: probe
on: {push: {branches: [probe-sights]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          P=images/pois/de28838f-09f0-486a-9a43-720f8482a2ee.jpg
          for b in https://api.opdagdanmark.dk https://www.opdagdanmark.dk https://udforsk.opdagdanmark.dk https://api.opdagdanmark.dk/images/v1 https://cdn.opdagdanmark.dk; do echo "$b/$P $(curl -s -o /dev/null -w '%{http_code} %{content_type} %{size_download}' "$b/$P")"; done
          curl -s "https://api.opdagdanmark.dk/pois/v1/find?poiIds%5B%5D=63786bf9-5d30-47c2-b2a3-83475afba5eb" -o /dev/null -w "%{http_code}\n"
          curl -s https://udforsk.opdagdanmark.dk/ | grep -o '[a-z:/.]*images/pois[^"]*' | head -3
          curl -s https://udforsk.opdagdanmark.dk/ | grep -o 'https://[a-z0-9.-]*opdagdanmark[a-z0-9./-]*' | sort -u | head
