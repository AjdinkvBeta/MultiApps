name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Macintosh) AppleWebKit/605.1.15 Version/18.0 Safari/604.1'
          curl -sSL -A "$UA" 'https://udforsk.opdagdanmark.dk/dist/js/home/explore.view.min.js' -o /tmp/e.js
          for k in '/events/v1/find' '/search/v2/map'; do echo "=== $k"; grep -o ".\{700\}$k.\{500\}" /tmp/e.js | head -c 1300; echo; done
          echo "=== params"; grep -oE '(lat|lng|latitude|longitude|radius|distance|from|to|startDate|endDate|categor[a-zA-Z]*|skip|take|page|pageSize|bounds|zoom)[a-zA-Z]*:' /tmp/e.js | sort | uniq -c | sort -rn | head -40
          curl -sSL -A "$UA" 'https://udforsk.opdagdanmark.dk/?kategori=begivenheder' | grep -oE 'curr[a-zA-Z]*Category[^;]{0,80}|kategori[^;]{0,80}' | head
