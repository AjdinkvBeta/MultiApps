name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Macintosh) AppleWebKit/605.1.15 Version/18.0 Safari/604.1'
          curl -sSL -A "$UA" 'https://udforsk.opdagdanmark.dk/?kategori=begivenheder' -o /tmp/p.html
          grep -oE '<(script|link)[^>]*(src|href)="[^"]*"' /tmp/p.html | head -20
          grep -oE '<meta[^>]*>' /tmp/p.html | grep -iv 'google' | head -20
          for js in $(grep -oE 'src="[^"]*\.js[^"]*"' /tmp/p.html | cut -d'"' -f2); do
            case "$js" in http*) u=$js;; //*) u="https:$js";; *) u="https://udforsk.opdagdanmark.dk/${js#/}";; esac
            echo "=== $u"; curl -sSL -A "$UA" "$u" -o /tmp/a.js
            grep -oE '"/[a-zA-Z0-9_/\-]*(event|begiven|search|items|places|location|categor)[a-zA-Z0-9_/\-]*' /tmp/a.js | sort -u | head -30
            grep -oE '(api|API)[a-zA-Z_.]*\s*[\+:]\s*"[^"]{1,80}"' /tmp/a.js | sort -u | head -20
            grep -oE 'fetch\([^)]{0,120}' /tmp/a.js | head -10
            grep -oE '\.(get|post)\(\s*[^,)]{0,120}' /tmp/a.js | head -20
          done
