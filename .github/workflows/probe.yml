name: probe
on:
  push:
    branches: [probe]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - shell: bash {0}
        run: |
          UA='Mozilla/5.0 (Macintosh) AppleWebKit/605.1.15 Version/18.0 Safari/604.1'
          A=https://api.opdagdanmark.dk
          curl -sS -A "$UA" "$A/search/v2/map?q=&categories=6bbda330-e221-44bd-8b5d-01c9b58da062" -o /tmp/m.json
          IDS=$(python3 -c "import json; f=[x for x in json.load(open('/tmp/m.json'))['features'] if x['properties']['type']=='event']; print('&'.join('eventIds='+x['id'] for x in f[:2]))")
          echo "--- find"; curl -sS -A "$UA" "$A/events/v1/find?$IDS" | python3 -m json.tool | head -150
          ID1=$(python3 -c "import json; f=[x for x in json.load(open('/tmp/m.json'))['features'] if x['properties']['type']=='event']; print(f[0]['id'])")
          echo "--- 100 ids"; IDS100=$(python3 -c "import json; f=[x for x in json.load(open('/tmp/m.json'))['features'] if x['properties']['type']=='event']; print('&'.join('eventIds='+x['id'] for x in f[:100]))"); curl -sS -A "$UA" -o /tmp/f.json -w '%{http_code} %{size_download} %{time_total}\n' "$A/events/v1/find?$IDS100"; python3 -c "import json; print(len(json.load(open('/tmp/f.json'))))"
          python3 -c "import json; m=json.load(open('/tmp/m.json')); import collections; print(collections.Counter(len(x['properties']) for x in m['features'])); print(m['features'][100]['properties'])"
