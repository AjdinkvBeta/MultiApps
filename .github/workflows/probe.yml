name: probe
on: {push: {branches: [probe3]}}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm view @spotify/basic-pitch version time.modified dependencies
          npm view onnxruntime-web dist-tags
          curl -s https://data.jsdelivr.com/v1/package/npm/@spotify/basic-pitch@1.0.1 | jq -c '[.files[] | {name, files: [.files[]?.name]}]' | cut -c1-1500
          curl -sI https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/model/model.json | head -3
          curl -s "https://cdn.jsdelivr.net/npm/@spotify/basic-pitch@1.0.1/+esm" | head -c 600; echo
          curl -sIL -H "Origin: https://ajdinkvbeta.github.io" https://huggingface.co/adowu/htdemucs-onnx/resolve/main/htdemucs_fp16weights.onnx | grep -iE "^HTTP|access-control|content-length|location" | head -12
          curl -s https://data.jsdelivr.com/v1/package/npm/onnxruntime-web@1.20.1 | jq -r '.files[] | select(.name=="dist") | .files[].name' | head -40
