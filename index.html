<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MultiApps</title>
<meta name="theme-color" content="#2b333d">
<style>
  :root { --bg: #2b333d; --ink: #e8edf2; --muted: #9aa7b4; --line: #3c4653; --accent: #6cc4e0; }
  @media (prefers-color-scheme: light) { :root { --bg: #f2f4f6; --ink: #1d242c; --muted: #5b6672; --line: #d5dbe1; --accent: #1f7fa3; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px calc(32px + env(safe-area-inset-bottom)); }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }
  a.app { display: grid; grid-template-columns: 44px 1fr auto; gap: 14px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--line); color: inherit; text-decoration: none; }
  a.app:first-of-type { border-top: 1px solid var(--line); }
  a.app img { width: 44px; height: 44px; border-radius: 10px; }
  a.app b { display: block; font-size: 1.05rem; }
  a.app span { color: var(--muted); font-size: .92rem; }
  a.app i { color: var(--accent); font-style: normal; font-size: 1.3rem; }
</style>
</head>
<body>
<main>
  <h1>MultiApps</h1>
  <p class="sub">Mine egne apps.</p>
  <a class="app" href="kursvagt/"><img src="kursvagt/icon.svg" alt=""><div><b>Kursvagt</b><span>Aktie- og kryptoanalyse, skat og handelssimulator</span></div><i>›</i></a>
</main>
</body>
</html>
