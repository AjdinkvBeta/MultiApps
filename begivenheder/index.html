<style>
:root{--bg:#1e242b;--ink:#e8edf2;--muted:#9aa7b4;--line:#38424e;--accent:#6cc4e0;--accent-ink:#06222c;--danger:#f08a7a;--ok:#7fd6a4;--field:#262e37}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f6;--ink:#1d242c;--muted:#5b6672;--line:#d5dbe1;--accent:#1f7fa3;--accent-ink:#fff;--danger:#b8432f;--ok:#2f8a57;--field:#fff}}
*{box-sizing:border-box;touch-action:pan-x pan-y}
#map,#map *{touch-action:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top a{text-decoration:none;font-size:1.5rem;line-height:1;color:var(--muted);padding:4px 6px 4px 0}
h1{font-size:1.45rem;margin:0}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:48px}
.row.first{border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:.85rem}
.name{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--accent);padding:6px 0 6px 10px;font-weight:600;white-space:nowrap;text-decoration:none}
.hidden{display:none!important}
input.plain{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;outline:none;padding:4px 0}
input.plain::placeholder{color:var(--muted);opacity:.8}
input[type=date].plain{text-align:center;-webkit-appearance:none;appearance:none;min-height:24px}
input[type=range]{flex:1;accent-color:var(--accent);touch-action:pan-x}
#map{height:48vh;min-height:280px;border-radius:12px;overflow:hidden;background:var(--field);margin-top:4px}
.leaflet-container{font:inherit}
.handle{width:22px;height:22px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 1px 4px #0008}
.centerdot{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 1px 4px #0008}
#sugg .row{cursor:pointer}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
/* Prikker og info på kortet */
.pin{width:26px;height:26px;border-radius:50%;background:#f0b43c;border:2px solid #fff;box-shadow:0 1px 4px #0008;display:grid;place-items:center;color:#1d1606;font:700 12px/1 system-ui,sans-serif}
.pin.one{width:18px;height:18px}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink);box-shadow:0 4px 18px #0007}
.leaflet-popup-content{margin:12px 14px;width:min(280px,72vw)!important;max-height:min(34vh,300px);overflow:auto;-webkit-overflow-scrolling:touch;font-size:14px;line-height:1.35}
.leaflet-popup-content,.leaflet-popup-content *{touch-action:pan-y}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
#spot{border-bottom:2px solid var(--accent);margin-top:8px}
.pop{padding:12px 0;border-top:1px solid var(--line)}
.pop img{width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block}
.pop b{display:block;font-size:15px;margin-bottom:2px}
.pop .meta{font-size:12.5px}
.pop p{margin:6px 0 0;color:var(--ink);font-size:13px}
.pop .acts{display:flex;gap:16px;margin-top:6px}
.pop .acts a{font-weight:600;text-decoration:none}
.ev.hl{background:color-mix(in srgb,var(--accent) 18%,transparent);transition:background 1.5s}
#map{margin-top:12px}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 2px 4px 10px}
.day{font-weight:700;padding:16px 0 4px;border-bottom:1px solid var(--line);font-size:.95rem}
.ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;align-items:flex-start}
.ev .t{width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;padding-top:1px}
.ev img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--field)}
.err{color:var(--danger)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
.dot.wait{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
</style>
<script>["gesturestart","gesturechange","gestureend"].forEach(function(ev){document.addEventListener(ev,function(e){if(!(e.target.closest&&e.target.closest('#map')))e.preventDefault();},{passive:false});});</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<body>
<main>
  <div class="top"><a href="../" aria-label="Til MultiApps">‹</a><h1>Begivenheder</h1></div>

  <div class="row first"><input class="plain" id="q" type="search" placeholder="Søg by eller adresse" autocomplete="off" enterkeyhint="search"><button class="link" id="me">Min position</button></div>
  <div id="sugg"></div>
  <div class="row"><span>Fra</span><input class="plain" type="date" id="from"><span>Til</span><input class="plain" type="date" id="to"></div>
  <div class="row"><span>Radius</span><input type="range" id="rad" min="1" max="100" step="1"><span id="radV" style="width:58px;text-align:right;font-variant-numeric:tabular-nums"></span></div>
  <div id="map"></div>
  <div id="spot" class="hidden"></div>

  <div style="display:flex;align-items:baseline;gap:10px;margin:24px 0 4px"><h2 id="resHead" style="margin:0;flex:1">Begivenheder</h2><button class="link" id="updNow" style="padding:0">Opdatér nu</button></div>
  <p class="meta" id="updMsg" style="margin:0 0 6px"></p>
  <div id="list"></div>

  <h2>Kilder</h2>
  <div id="srcs"></div>

  <h2>Kalendere (iCal)</h2>
  <div id="cals"></div>
  <div class="row"><input class="plain" id="calIn" type="url" placeholder="Indsæt kalender-link (.ics / webcal)" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="link" id="calAdd">Tilføj</button></div>

  <h2>Google-søgning</h2>
  <div class="row"><div class="grow"><div>Hele landet</div><div class="meta" id="gWhole"></div></div><label class="switch"><input type="checkbox" id="gAll"><span></span></label></div>
  <div class="row"><span class="meta grow">Prioriterede byer – opdateres oftest</span></div>
  <div id="gplaces"></div>
  <div class="row"><input class="plain" id="gIn" type="text" placeholder="Tilføj by" autocomplete="off"><button class="link" id="gAdd">Tilføj</button></div>
  <p class="meta" id="gUse" style="margin:8px 0 0"></p>

  <h2>Nøgler</h2>
  <div class="row"><div class="grow"><div>Ticketmaster</div><div class="meta"><a href="https://developer-acct.ticketmaster.com/user/register" target="_blank" rel="noopener">Gratis nøgle</a></div></div><input class="plain" id="tmKey" type="password" placeholder="Consumer Key" autocomplete="off" style="max-width:46%;text-align:right"></div>
  <div class="row"><div class="grow"><div>GitHub</div><div class="meta">Til at gemme kalendere og byer</div></div><input class="plain" id="ghKey" type="password" placeholder="github_pat_…" autocomplete="off" style="max-width:46%;text-align:right"></div>
  <p class="meta" style="margin:14px 0 0">Nøgler gemmes kun på denne enhed. Kort © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></p>
</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const DAYS = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'], MON = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
function km(a, b, c, d){ const R = 6371, r = x => x * Math.PI / 180, dl = r(c - a), dg = r(d - b), h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function geohash(lat, lon, prec){
  const B = '0123456789bcdefghjkmnpqrstuvwxyz'; let la = [-90, 90], lo = [-180, 180], h = '', bit = 0, ch = 0, even = true;
  while (h.length < prec) { const r = even ? lo : la, v = even ? lon : lat, mid = (r[0] + r[1]) / 2; if (v >= mid) { ch |= 16 >> bit; r[0] = mid; } else r[1] = mid; even = !even; if (++bit === 5) { h += B[ch]; bit = 0; ch = 0; } }
  return h;
}

/* ---------- Tilstand ---------- */
const today = new Date(); today.setHours(0, 0, 0, 0);
const S = Object.assign({lat: 54.9095, lng: 9.7923, r: 15, place: null}, LS.get('beg:area') || {});
$('#from').value = isoDay(today); $('#to').value = isoDay(addDays(today, 30));
$('#from').min = isoDay(today);
$('#rad').value = S.r; $('#tmKey').value = LS.get('beg:tmkey') || '';
const saveArea = () => LS.set('beg:area', {lat: S.lat, lng: S.lng, r: S.r, place: S.place});

/* ---------- Kort ---------- */
const map = L.map('map', {zoomControl: false, attributionControl: false}).setView([S.lat, S.lng], 10);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 18}).addTo(map);
const circle = L.circle([S.lat, S.lng], {radius: S.r * 1000, color: getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#6cc4e0', weight: 2, fillOpacity: .12}).addTo(map);
const center = L.marker([S.lat, S.lng], {draggable: true, zIndexOffset: -1000, icon: L.divIcon({className: '', html: '<div class="centerdot"></div>', iconSize: [16, 16], iconAnchor: [8, 8]})}).addTo(map);
const handle = L.marker([0, 0], {draggable: true, icon: L.divIcon({className: '', html: '<div class="handle"></div>', iconSize: [22, 22], iconAnchor: [11, 11]})}).addTo(map);
const evLayer = L.layerGroup().addTo(map);
// "Vis i listen": rul til begivenheden og fremhæv den kort
document.addEventListener('click', e => {
  const a = e.target.closest('[data-show]'); if (!a) return; e.preventDefault();
  const el = document.getElementById('ev' + a.dataset.show); if (!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'center'}); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1800);
});
function edgePoint(){ return L.latLng(S.lat, S.lng + (S.r / (111.32 * Math.cos(S.lat * Math.PI / 180)))); }
function draw(fit){
  circle.setLatLng([S.lat, S.lng]); circle.setRadius(S.r * 1000);
  center.setLatLng([S.lat, S.lng]); handle.setLatLng(edgePoint());
  $('#rad').value = Math.min(100, S.r); $('#radV').textContent = (S.r < 10 ? S.r.toFixed(1).replace('.', ',') : Math.round(S.r)) + ' km';
  if (fit) map.fitBounds(circle.getBounds(), {padding: [24, 24]});
}
draw(true);
map.on('click', e => { S.lat = e.latlng.lat; S.lng = e.latlng.lng; S.place = null; draw(); changed(); });
center.on('drag', e => { const p = e.target.getLatLng(); S.lat = p.lat; S.lng = p.lng; circle.setLatLng(p); handle.setLatLng(edgePoint()); });
center.on('dragend', () => { S.place = null; changed(); });
handle.on('drag', e => { const p = e.target.getLatLng(); S.r = Math.max(.5, Math.min(300, km(S.lat, S.lng, p.lat, p.lng))); circle.setRadius(S.r * 1000); $('#radV').textContent = (S.r < 10 ? S.r.toFixed(1).replace('.', ',') : Math.round(S.r)) + ' km'; });
handle.on('dragend', () => { draw(); changed(); });
$('#rad').oninput = e => { S.r = +e.target.value; draw(); };
$('#rad').onchange = () => { draw(true); changed(); };

/* ---------- Adressesøgning og stednavn (OpenStreetMap Nominatim) ---------- */
let qT = null;
$('#q').oninput = e => { clearTimeout(qT); const v = e.target.value.trim(); if (v.length < 3) { $('#sugg').innerHTML = ''; return; } qT = setTimeout(() => geocode(v), 450); };
$('#q').onkeydown = e => { if (e.key === 'Enter') { const f = $('#sugg .row'); if (f) f.click(); } };
async function geocode(v){
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=5&accept-language=da&q=' + encodeURIComponent(v));
    const a = await r.json();
    $('#sugg').innerHTML = a.map((x, i) => `<div class="row" data-i="${i}"><span class="grow name">${esc(x.display_name)}</span></div>`).join('');
    $('#sugg').onclick = e => { const el = e.target.closest('[data-i]'); if (!el) return; const x = a[+el.dataset.i];
      S.lat = +x.lat; S.lng = +x.lon; S.place = placeOf(x.address); $('#sugg').innerHTML = ''; $('#q').value = ''; $('#q').blur(); draw(true); changed(); };
  } catch (e) { $('#sugg').innerHTML = '<div class="row meta">Søgningen virker ikke lige nu</div>'; }
}
function placeOf(a){
  a = a || {};
  const muni = (a.municipality || '').replace(/ Kommune$/, '').replace(/^Københavns$/, 'København');
  return {city: a.city || a.town || a.village || muni || a.county || '', muni, cc: (a.country_code || '').toLowerCase()};
}
async function reverse(){
  if (S.place) return S.place;
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=10&addressdetails=1&accept-language=da&lat=${S.lat}&lon=${S.lng}`);
    S.place = placeOf((await r.json()).address); saveArea();
  } catch (e) { S.place = {city: '', muni: '', cc: ''}; }
  return S.place;
}
$('#me').onclick = () => {
  if (!navigator.geolocation) return;
  $('#me').textContent = '…';
  navigator.geolocation.getCurrentPosition(p => { $('#me').textContent = 'Min position'; S.lat = p.coords.latitude; S.lng = p.coords.longitude; S.place = null; draw(true); changed(); },
    () => { $('#me').textContent = 'Min position'; }, {enableHighAccuracy: true, timeout: 10000, maximumAge: 60000});
};

/* ---------- Datoer ---------- */
for (const id of ['#from', '#to']) $(id).onchange = () => {
  if (!$('#from').value) $('#from').value = isoDay(today);
  if (!$('#to').value || $('#to').value < $('#from').value) $('#to').value = $('#from').value;
  changed();
};

/* ---------- Kilder ----------
   Hver kilde returnerer [{src, id, title, day:'YYYY-MM-DD', time:'HH:MM'|'', venue, city, lat, lng, url, img, cat}].
   Ticketmaster: søger direkte på punkt + radius. Giver en søgning over 1.000 resultater, deles perioden op,
   så intet falder fra (API'et viser højst 1.000 pr. søgning). */
async function ticketmaster(q, onProgress){
  const key = ($('#tmKey').value || '').trim();
  if (!key) return {status: 'nokey', items: []};
  const items = [], gp = geohash(q.lat, q.lng, 9), radius = Math.max(1, Math.ceil(q.r));
  let calls = 0, last = 0;
  const call = async (a, b, page) => {
    const u = new URL('https://app.ticketmaster.com/discovery/v2/events.json');
    Object.entries({apikey: key, geoPoint: gp, radius, unit: 'km', startDateTime: a.toISOString().replace(/\.\d+Z$/, 'Z'), endDateTime: b.toISOString().replace(/\.\d+Z$/, 'Z'), size: 200, page, sort: 'date,asc', locale: '*'}).forEach(([k, v]) => u.searchParams.set(k, v));
    for (let tries = 0; tries < 4; tries++) {
      const wait = 220 - (Date.now() - last); if (wait > 0) await sleep(wait);   // højst ~5 kald i sekundet
      last = Date.now(); calls++;
      const r = await fetch(u);
      if (r.status === 429) { await sleep(1200); continue; }
      if (r.status === 401) throw Object.assign(new Error('Nøglen virker ikke'), {key: true});
      if (!r.ok) throw new Error('Fejl ' + r.status);
      return r.json();
    }
    throw new Error('For mange kald – prøv igen om lidt');
  };
  const range = async (a, b) => {
    for (let page = 0; ; page++) {
      const j = await call(a, b, page), total = (j.page && j.page.totalElements) || 0;
      if (page === 0 && total > 1000 && b - a > 6 * 3600e3) {
        const mid = new Date(a.getTime() + (b - a) / 2); await range(a, mid); await range(new Date(mid.getTime() + 1000), b); return;
      }
      for (const e of (j._embedded && j._embedded.events) || []) {
        const v = (e._embedded && e._embedded.venues && e._embedded.venues[0]) || {}, st = (e.dates && e.dates.start) || {};
        const img = (e.images || []).filter(i => i.width >= 100).sort((x, y) => x.width - y.width)[0];
        items.push({src: 'Ticketmaster', id: 'tm:' + e.id, title: e.name, day: st.localDate || (st.dateTime || '').slice(0, 10), time: (st.localTime || '').slice(0, 5),
          venue: v.name || '', city: (v.city && v.city.name) || '', lat: v.location ? +v.location.latitude : null, lng: v.location ? +v.location.longitude : null,
          url: e.url, img: img ? img.url : '', desc: String(e.info || e.pleaseNote || '').slice(0, 300), cat: (e.classifications && e.classifications[0] && e.classifications[0].segment && e.classifications[0].segment.name) || ''});
      }
      onProgress && onProgress(items.length);
      const pages = (j.page && j.page.totalPages) || 0;
      if (page + 1 >= pages || (page + 1) * 200 >= 1000) break;
    }
  };
  await range(q.from, q.to);
  return {status: 'ok', items, calls};
}
// Kalendere og Google samles af GitHub Actionen i data/events.json (se collector/collect.mjs)
let DATA = null, dataP = null;
function loadData(force){
  if (dataP && !force) return dataP;
  dataP = fetch('data/events.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.ok ? r.json() : null).catch(() => null).then(d => { DATA = d; renderKilder(); return d; });
  return dataP;
}
const inRange = (e, q) => e.day >= isoDay(q.from) && e.day <= isoDay(q.to);
async function collected(kind, q){
  const d = await loadData();
  if (!d) return {status: 'ok', items: []};
  return {status: 'ok', items: d.events.filter(e => e.kind === kind && inRange(e, q))};
}
const SOURCES = [
  {name: 'Ticketmaster', fn: ticketmaster},
  {name: 'Kalendere', fn: q => collected('ical', q)},
  {name: 'Google', fn: q => collected('google', q)},
];

/* ---------- Søgning ---------- */
let runId = 0, chT = null;
function changed(){ saveArea(); clearTimeout(chT); chT = setTimeout(search, 350); }
async function search(){
  const id = ++runId;
  const q = {lat: S.lat, lng: S.lng, r: S.r, from: parseDay($('#from').value), to: new Date(parseDay($('#to').value).getTime() + 86400e3 - 1000)};
  const st = {};
  const renderSrc = () => {
    const place = S.place || {};
    const rows = SOURCES.map(s => {
      const x = st[s.name] || {state: 'wait'};
      const txt = x.state === 'wait' ? 'søger…' + (x.n ? ' ' + x.n : '') : x.state === 'nokey' ? 'mangler nøgle (se Kilder)' : x.state === 'err' ? `<span class="err">${esc(x.msg)}</span>` : x.n + ' fundet' + (x.unplaced ? ` · ${x.unplaced} uden sted` : '');
      return `<div class="row"><span class="dot ${x.state === 'ok' ? 'on' : x.state === 'wait' ? 'wait' : ''}"></span><span class="grow">${s.name}</span><span class="meta">${txt}</span></div>`;
    });
    const city = place.city || place.muni;
    if (place.cc === 'dk') {
      const area = place.muni || place.city;
      rows.push(`<div class="row"><span class="dot"></span><span class="grow">KultuNaut</span><a class="link" target="_blank" rel="noopener" href="https://www.kultunaut.dk/perl/arrlist/type-nynaut?Area=${escape(area)}">Åbn ${esc(area)}</a></div>`);
    }
    const gs = ((KILDER && KILDER.google && KILDER.google.steder) || []).map(x => x.toLowerCase());
    if (city && !gs.includes(city.toLowerCase())) rows.push(`<div class="row"><span class="dot"></span><span class="grow">Google: ${esc(city)} er ikke med</span><button class="link" data-addg="${esc(city)}">Tilføj</button></div>`);
    if (city) rows.push(`<div class="row"><span class="dot"></span><span class="grow">Facebook</span><a class="link" target="_blank" rel="noopener" href="https://www.facebook.com/events/search/?q=${encodeURIComponent(city)}">Åbn ${esc(city)}</a></div>`);
    $('#srcs').innerHTML = rows.join('');
    const ag = $('#srcs [data-addg]'); if (ag) ag.onclick = () => { const v = ag.dataset.addg; saveKilder(k => { k.google = k.google || {}; k.google.steder = [...new Set((k.google.steder || []).concat([v]))]; }); };
  };
  renderSrc(); $('#list').innerHTML = ''; evLayer.clearLayers();
  reverse().then(() => { if (id === runId) renderSrc(); });
  const all = [];
  await Promise.all(SOURCES.map(async s => {
    st[s.name] = {state: 'wait'};
    try {
      const res = await s.fn(q, n => { if (id === runId) { st[s.name].n = n; renderSrc(); } });
      if (id !== runId) return;
      if (res.status === 'nokey') { st[s.name] = {state: 'nokey'}; renderSrc(); return; }
      const placed = res.items.filter(e => e.lat != null && !isNaN(e.lat));
      const inside = placed.filter(e => km(S.lat, S.lng, e.lat, e.lng) <= S.r + .05);
      st[s.name] = {state: 'ok', n: inside.length, unplaced: res.items.length - placed.length}; all.push(...inside);
    } catch (e) { if (id === runId) st[s.name] = {state: 'err', msg: e.message || 'fejl'}; }
    if (id === runId) { renderSrc(); render(all); }
  }));
}
function dayLabel(day){
  const d = parseDay(day), t = Math.round((d - today) / 864e5);
  return (t === 0 ? 'I dag' : t === 1 ? 'I morgen' : DAYS[d.getDay()][0].toUpperCase() + DAYS[d.getDay()].slice(1)) + ` ${d.getDate()}. ${MON[d.getMonth()]}`;
}
const fmtKm = d => (d < 10 ? d.toFixed(1).replace('.', ',') : Math.round(d)) + ' km';
function popHtml(e, i){
  const dist = km(S.lat, S.lng, e.lat, e.lng);
  const where = [e.venue, e.city].filter(Boolean).join(', ');
  return `<div class="pop">${e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy">` : ''}<b>${esc(e.title)}</b>
    <div class="meta">${dayLabel(e.day)}${e.time ? ' · ' + esc(e.time) : ''}</div>
    <div class="meta">${esc(where)}${where ? ' · ' : ''}${fmtKm(dist)}</div>
    ${e.desc ? `<p>${esc(e.desc)}</p>` : ''}
    <div class="meta">${esc([...e.srcs].join(', '))}${e.cat && e.cat !== 'Undefined' ? ' · ' + esc(e.cat) : ''}</div>
    <div class="acts">${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">Åbn</a>` : ''}<a href="#" data-show="${i}">Vis i listen</a></div></div>`;
}
// Tryk på en prik: begivenhederne på det sted vises lige under kortet
function showSpot(evs, idx){
  const e0 = evs[idx[0]], box = $('#spot');
  box.innerHTML = `<div class="row" style="border-bottom:0"><div class="grow"><b>${esc(e0.venue || e0.city || 'Sted')}</b><div class="meta">${idx.length} ${idx.length === 1 ? 'begivenhed' : 'begivenheder'} · ${fmtKm(km(S.lat, S.lng, e0.lat, e0.lng))}</div></div><button class="x" id="spotX" aria-label="Luk">×</button></div>`
    + idx.slice(0, 60).map(i => popHtml(evs[i], i)).join('') + (idx.length > 60 ? `<p class="meta">+ ${idx.length - 60} flere i listen</p>` : '');
  box.classList.remove('hidden');
  $('#spotX').onclick = () => box.classList.add('hidden');
  box.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}
function render(list){
  // Samme begivenhed kan stå flere gange (fx flere billettyper) – vis den én gang
  const norm = t => String(t || '').toLowerCase().normalize('NFKD').replace(/[^a-z0-9æøå]+/g, ' ').trim();
  // Nøgle: titel + dag + tid. Mangler tiden hos én kilde, lægges den sammen med samme titel og dag fra en anden.
  const best = new Map(), score = x => (x.img ? 1 : 0) + (x.approx ? 0 : 2) + (x.url ? 1 : 0) + (x.venue ? 1 : 0);
  const add = (k, e) => { const o = best.get(k); if (!o) best.set(k, Object.assign({}, e, {srcs: new Set(e.srcs || [e.src])})); else { for (const x of e.srcs || [e.src]) o.srcs.add(x); if (score(e) > score(o)) Object.assign(o, e, {srcs: o.srcs, time: o.time || e.time}); } };
  for (const e of list) if (e.time) add(norm(e.title) + '|' + e.day + '|' + e.time, e);
  for (const e of list) if (!e.time) {
    const pre = norm(e.title) + '|' + e.day + '|', hit = [...best.keys()].find(k => k.startsWith(pre));
    add(hit || pre, e);
  }
  const evs = [...best.values()].sort((a, b) => (a.day + (a.time || '99')).localeCompare(b.day + (b.time || '99')) || a.title.localeCompare(b.title, 'da'));
  $('#resHead').textContent = evs.length ? evs.length + (evs.length === 1 ? ' begivenhed' : ' begivenheder') : 'Begivenheder';
  let html = '', lastDay = '';
  for (const e of evs) {
    if (e.day !== lastDay) {
      lastDay = e.day; html += `<div class="day">${dayLabel(e.day)}</div>`;
    }
    const dist = e.lat != null && !isNaN(e.lat) && !e.approx ? km(S.lat, S.lng, e.lat, e.lng) : null;
    const where = [e.venue, e.city].filter(Boolean).join(', ');
    html += `<a class="ev" id="ev${evs.indexOf(e)}" href="${esc(e.url || '#')}" target="_blank" rel="noopener"><span class="t">${esc(e.time || '')}</span><div class="grow"><div class="name">${esc(e.title)}</div><div class="meta">${esc(where)}${dist != null ? ' · ' + (dist < 10 ? dist.toFixed(1).replace('.', ',') : Math.round(dist)) + ' km' : ''}${e.cat && e.cat !== 'Undefined' ? ' · ' + esc(e.cat) : ''} · ${esc([...e.srcs].join(', '))}</div></div>${e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy">` : ''}</a>`;
  }
  $('#list').innerHTML = html; $('#spot').classList.add('hidden');
  evLayer.clearLayers();
  // Én prik pr. sted; flere begivenheder samme sted vises med antal og samlet i boblen
  const spots = new Map();
  evs.forEach((e, i) => { if (e.lat == null || isNaN(e.lat) || e.approx) return; const k = e.lat.toFixed(4) + ',' + e.lng.toFixed(4); if (!spots.has(k)) spots.set(k, []); spots.get(k).push(i); });
  for (const idx of spots.values()) {
    const e0 = evs[idx[0]], n = idx.length;
    const icon = L.divIcon({className: '', html: `<div class="pin${n === 1 ? ' one' : ''}">${n > 1 ? (n > 99 ? '99+' : n) : ''}</div>`, iconSize: n === 1 ? [18, 18] : [26, 26], iconAnchor: n === 1 ? [9, 9] : [13, 13]});
    L.marker([e0.lat, e0.lng], {icon, keyboard: false, zIndexOffset: n * 10}).on('click', () => showSpot(evs, idx)).addTo(evLayer);
  }
}
$('#tmKey').onchange = e => { LS.set('beg:tmkey', e.target.value.trim()); search(); };

/* ---------- Kalendere og Google-byer ----------
   Listen ligger i begivenheder/kilder.json i repoet. Ændringer gemmes med en GitHub-nøgle (samme som i Kursvagt),
   og Actionen startes, så de nye begivenheder er med efter et par minutter. */
const REPO = 'AjdinkvBeta/MultiApps', KPATH = 'begivenheder/kilder.json';
const ghKey = () => { try { return localStorage.getItem('kv-ghtoken') || ''; } catch (e) { return ''; } };
$('#ghKey').value = ghKey();
$('#ghKey').onchange = e => { try { localStorage.setItem('kv-ghtoken', e.target.value.trim()); } catch (er) {} };
let KILDER = null, busy = false;
fetch('kilder.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()).then(k => { KILDER = k; renderKilder(); }).catch(() => {});
function msg(t){ $('#gUse').innerHTML = t; $('#updMsg').innerHTML = busy ? t : ''; }
function renderKilder(){
  const k = KILDER || {kalendere: [], google: {steder: []}}, src = (DATA && DATA.sources) || {}, info = {};
  for (const c of src.kalendere || []) info[c.url] = c;
  $('#cals').innerHTML = (k.kalendere || []).map((c, i) => { const x = info[c.url];
    return `<div class="row"><div class="grow"><div class="name">${esc(c.navn || (x && x.navn) || c.url)}</div><div class="meta">${x ? (x.err ? `<span class="err">${esc(x.err)}</span>` : x.n + ' begivenheder') : 'hentes ved næste opdatering'}</div></div><button class="x" data-cal="${i}" aria-label="Fjern">×</button></div>`; }).join('');
  const g = src.google || {}, up = g.opdateret || {};
  $('#gAll').checked = (k.google || {}).heleLandet !== false;
  $('#gWhole').textContent = g.byer ? `${g.hentet || 0} af ${g.byer} byer hentet` : 'Søger byer i hele Danmark på skift';
  $('#gplaces').innerHTML = ((k.google || {}).steder || []).map((p, i) => `<div class="row"><div class="grow"><div>${esc(p)}</div><div class="meta">${up[p] ? 'opdateret ' + new Date(up[p]).toLocaleString('da-DK', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : 'hentes ved næste opdatering'}</div></div><button class="x" data-g="${i}" aria-label="Fjern">×</button></div>`).join('');
  if (!busy) msg(g.status === 'nokey' ? '<span class="err">GitHub kan ikke se SerpApi-nøglen.</span> Den skal ligge under Settings → Secrets and variables → Actions → Repository secrets med navnet SERPAPI_KEY.' : g.status ? `${g.left != null ? g.left + ' søgninger tilbage' : g.used + ' brugt'} denne måned${g.limit ? ' (af ' + g.limit + ')' : ''}${g.err ? ' · <span class="err">' + esc(g.err) + '</span>' : ''}` : '');
}
async function gh(path, opt){
  const r = await fetch('https://api.github.com/repos/' + REPO + path, Object.assign({}, opt, {headers: {Authorization: 'Bearer ' + ghKey(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'}}));
  if (!r.ok) { const t = r.status === 401 || r.status === 403 ? 'GitHub-nøglen virker ikke' : 'GitHub-fejl ' + r.status; throw new Error(t); }
  return r.status === 204 ? null : r.json();
}
// Gem ændringen i kilder.json (hvis der er en) og start indsamlingen
async function saveKilder(change, label){
  if (!ghKey()) { msg('<span class="err">Indsæt en GitHub-nøgle under Nøgler først.</span>'); return false; }
  busy = true; msg((label || 'Gemmer') + '…');
  try {
    if (change) {
      const cur = await gh('/contents/' + KPATH + '?ref=main');
      const k = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, '')))));
      change(k);
      await gh('/contents/' + KPATH, {method: 'PUT', body: JSON.stringify({message: 'Begivenheder: kilder', content: btoa(unescape(encodeURIComponent(JSON.stringify(k, null, 2) + '\n'))), sha: cur.sha, branch: 'main'})});
      KILDER = k;
    }
    await gh('/actions/workflows/kursvagt.yml/dispatches', {method: 'POST', body: JSON.stringify({ref: 'main', inputs: {beg: '1'}})});
    renderKilder(); msg('Henter begivenheder – det tager et par minutter…');
    const before = DATA && DATA.updatedAt;
    for (let i = 0; i < 24; i++) { await sleep(20000); const d = await loadData(true); if (d && d.updatedAt !== before) { busy = false; renderKilder(); search(); return true; } }
    busy = false; renderKilder();
  } catch (e) { busy = false; msg('<span class="err">' + esc(e.message) + '</span>'); return false; }
  return true;
}
$('#updNow').onclick = async () => {
  search();
  if (!ghKey()) { $('#updMsg').innerHTML = 'Ticketmaster er opdateret. Kalendere og Google opdateres af sig selv ca. hver halve time – med en GitHub-nøgle under Nøgler kan de hentes med det samme.'; return; }
  $('#updNow').disabled = true;
  await saveKilder(null, 'Henter nu');
  $('#updNow').disabled = false; $('#updMsg').textContent = DATA && DATA.updatedAt ? 'Hentet ' + new Date(DATA.updatedAt).toLocaleString('da-DK', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
};
$('#calAdd').onclick = () => {
  const u = $('#calIn').value.trim(); if (!/^(https?|webcal):\/\//i.test(u)) { msg('<span class="err">Linket skal starte med https:// eller webcal://</span>'); return; }
  saveKilder(k => { k.kalendere = (k.kalendere || []).filter(c => c.url !== u).concat([{url: u}]); }).then(ok => { if (ok) $('#calIn').value = ''; });
};
$('#gAdd').onclick = () => {
  const v = $('#gIn').value.trim(); if (!v) return;
  saveKilder(k => { k.google = k.google || {}; k.google.steder = [...new Set((k.google.steder || []).concat([v]))]; }).then(ok => { if (ok) $('#gIn').value = ''; });
};
$('#cals').onclick = e => { const b = e.target.closest('[data-cal]'); if (!b) return; const u = KILDER.kalendere[+b.dataset.cal].url; saveKilder(k => { k.kalendere = (k.kalendere || []).filter(c => c.url !== u); }); };
$('#gAll').onchange = e => { const v = e.target.checked; saveKilder(k => { k.google = k.google || {}; k.google.heleLandet = v; }).then(ok => { if (!ok) e.target.checked = !v; }); };
$('#gplaces').onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; const p = KILDER.google.steder[+b.dataset.g]; saveKilder(k => { k.google.steder = (k.google.steder || []).filter(x => x !== p); }); };

search();
})();
</script>
