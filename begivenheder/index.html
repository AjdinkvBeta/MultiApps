<style>
:root{--gold:#f5c518;--bg:#1e242b;--ink:#e8edf2;--muted:#9aa7b4;--line:#38424e;--accent:#6cc4e0;--accent-ink:#06222c;--danger:#f08a7a;--ok:#7fd6a4;--field:#262e37}
@media (prefers-color-scheme:light){:root{--bg:#f2f4f6;--ink:#1d242c;--muted:#5b6672;--line:#d5dbe1;--accent:#1f7fa3;--accent-ink:#fff;--danger:#b8432f;--ok:#2f8a57;--field:#fff}}
*{box-sizing:border-box;touch-action:pan-x pan-y}
#map,#map *{touch-action:none}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
a{color:var(--accent)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.top a{text-decoration:none;font-size:1.5rem;line-height:1;color:var(--muted);padding:4px 6px 4px 0}
h1{font-size:1.45rem;margin:0}
h2{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 0 4px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:48px}
.row.first{border-top:1px solid var(--line)}
.grow{flex:1;min-width:0}
.meta{color:var(--muted);font-size:.85rem}
.name{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--accent);padding:6px 0 6px 10px;font-weight:600;white-space:nowrap;text-decoration:none}
.hidden{display:none!important}
input.plain{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;outline:none;padding:4px 0}
input.plain::placeholder{color:var(--muted);opacity:.8}
input[type=date].plain{text-align:center;-webkit-appearance:none;appearance:none;min-height:24px}
input[type=range]{flex:1;accent-color:var(--accent);touch-action:pan-x}
#map{height:48vh;min-height:280px;border-radius:12px;overflow:hidden;background:var(--field);margin-top:4px}
.leaflet-container{font:inherit}

.centerdot{width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 1px 4px #0008}
#sugg .row{cursor:pointer}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
/* Prikker og info på kortet */
.pin{width:26px;height:26px;border-radius:50%;background:#2f8fb5;border:2px solid #fff;box-shadow:0 1px 4px #0008;display:grid;place-items:center;color:#fff;font:700 12px/1 system-ui,sans-serif;position:relative}
/* Gemte: gul prik med stjerne; klynger med gemte får en gul stjerne-plet */
.pin.saved{background:var(--gold);color:#3a2c00}
.pin.one.saved::before{content:"★";font-size:11px;line-height:1}
.pin.hasSaved::after{content:"★";position:absolute;top:-7px;right:-7px;width:15px;height:15px;border-radius:50%;background:var(--gold);color:#3a2c00;font-size:9px;line-height:15px;text-align:center;border:1.5px solid #fff}
.pin.one{width:18px;height:18px}
.leaflet-marker-icon .pin{width:100%;height:100%;box-sizing:border-box}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink);box-shadow:0 4px 18px #0007}
.leaflet-popup-content{margin:12px 14px;width:min(280px,72vw)!important;max-height:min(34vh,300px);overflow:auto;-webkit-overflow-scrolling:touch;font-size:14px;line-height:1.35}
.leaflet-popup-content,.leaflet-popup-content *{touch-action:pan-y}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.pop{padding:12px 0;border-top:1px solid var(--line)}
.pop img{width:100%;max-height:160px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block}
.pop b{display:block;font-size:15px;margin-bottom:2px}
.pop .meta{font-size:12.5px}
.pop p{margin:6px 0 0;color:var(--ink);font-size:13px}
.pop .acts{display:flex;gap:16px;margin-top:6px}
.pop .acts a{font-weight:600;text-decoration:none}
/* Stjerne og gul markering af gemte begivenheder */
.star{background:none;border:0;padding:4px;margin:-4px -4px -4px 0;flex:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.star svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.star.on{color:var(--gold)}
.star.on svg{fill:var(--gold)}
.ev.saved,#pop .prow.saved{box-shadow:inset 0 0 0 2px var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border-radius:10px;padding-left:8px;padding-right:8px;margin:4px 0;border-bottom-color:transparent}
/* Gemte-knap under kortet – virker som filter */
.reshead{display:flex;align-items:center;gap:10px;margin:18px 0 4px}
.reshead h2{margin:0;flex:1}
.savedbtn{display:flex;align-items:center;gap:6px;background:var(--field);border:0;border-radius:99px;padding:7px 12px;color:var(--ink);font-weight:600;font-size:14px}
.savedbtn svg{width:16px;height:16px;fill:none;stroke:var(--gold);stroke-width:2;stroke-linejoin:round}
.savedbtn[aria-pressed="true"]{background:var(--gold);color:#3a2c00}
.savedbtn[aria-pressed="true"] svg{fill:#3a2c00;stroke:#3a2c00}
#savedN{font-weight:400;opacity:.8}
/* Kalender i datopanelet */
.cal{padding:6px 0 4px}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.calhead b{font-size:15px}
.calhead button{background:none;border:0;color:var(--accent);font-size:22px;padding:2px 10px;line-height:1}
.calhead button:disabled{opacity:.25}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 0;text-align:center}
.calgrid .wd{font-size:11px;color:var(--muted);padding:4px 0}
.calgrid button{background:none;border:0;height:38px;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;border-radius:0}
.calgrid button:disabled{color:var(--muted);opacity:.35}
.calgrid button.in{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.calgrid button.s,.calgrid button.e{background:var(--accent);color:var(--accent-ink);font-weight:700}
.calgrid button.s{border-radius:99px 0 0 99px}.calgrid button.e{border-radius:0 99px 99px 0}.calgrid button.s.e{border-radius:99px}
.calgrid button.today{text-decoration:underline;text-underline-offset:4px}
/* Filtre: dannes af de begivenheder, man kan se; vandret rulning */
/* Én linje, der kun kan skubbes sidelæns (ingen lodret rulning) */
.filters{display:flex;flex-wrap:nowrap;gap:8px;padding:10px 0 2px;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;touch-action:pan-x;margin:0 -16px;padding-left:16px;padding-right:16px;scroll-padding:0 16px}
.filters::-webkit-scrollbar{display:none}
.filters,.filters *{touch-action:pan-x}
.filters button{flex:none;background:var(--field);border:0;border-radius:99px;padding:7px 12px;color:var(--ink);font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:5px;line-height:1.1}
.filters button .n{font-size:12px;color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.filters button[aria-pressed="true"] .n{color:inherit;opacity:.75}
.filters .more{background:none;color:var(--accent);font-weight:600}
.filters:empty{display:none}
.ev.hl{background:color-mix(in srgb,var(--accent) 18%,transparent);transition:background 1.5s}
#map{margin-top:10px;height:56vh}
.top{justify-content:flex-start}
.top h1{flex:1}
.iconbtn{background:none;border:0;padding:6px;color:var(--accent);display:grid;place-items:center;flex:none}
.iconbtn svg,.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#gear{color:var(--muted)}
#gear[aria-expanded="true"]{color:var(--accent)}
.ic{color:var(--muted)}
.bar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;min-height:50px}
.bar input.plain{min-width:60px}
.chip{background:none;border:0;color:var(--accent);font-weight:600;white-space:nowrap;padding:6px 2px;font-size:15px}
.presets{display:flex;gap:4px 16px;flex-wrap:wrap;padding:10px 0;border-bottom:1px solid var(--line)}
.presets button{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0}
.mapwrap{position:relative;margin-top:10px}
#web{position:fixed;inset:0;z-index:2000;background:#0008;display:flex;align-items:flex-end}
#web .webbox{width:100%;height:calc(100% - env(safe-area-inset-top) - 36px);background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -6px 30px #0008}
@media (prefers-reduced-motion:no-preference){#web .webbox{animation:webin .22s ease-out}}
@keyframes webin{from{transform:translateY(40px);opacity:.4}}
#web .webhead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
#web .webhead b{font-size:15px;-webkit-line-clamp:1}
#web iframe{flex:1;width:100%;border:0;background:#fff}
#web.hidden{display:none}
.ev{cursor:pointer}
.openbtn{background:none;border:0;padding:6px 0 0;color:var(--accent);font-weight:600;font-size:14px}
/* Den begivenhed, man trykkede på i listen, fremhæves i popuppen */
#pop .prow.focus{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 3px 0 0 var(--accent);border-radius:10px;padding-left:8px;padding-right:8px;margin:4px 0;border-bottom-color:transparent}
#pop .prow.focus.saved{box-shadow:inset 3px 0 0 var(--accent),inset 0 0 0 2px var(--gold)}
.mapwrap #map{margin-top:0}
/* Popup oven på kortet: glider op fra bunden af kortet, kan rulles */
#pop{position:absolute;left:8px;right:8px;bottom:8px;max-height:72%;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);color:var(--ink);border-radius:14px;box-shadow:0 8px 28px #0009;z-index:1000;padding:0 14px 6px;touch-action:pan-y}
#pop *{touch-action:pan-y}
#pop .phead{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 8px;border-bottom:1px solid var(--line);z-index:1}
#pop .phead b{display:block;font-size:15px}
#pop .prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;font-size:13.5px;line-height:1.3}
#pop .prow:last-child{border-bottom:0}
#pop .pd{width:52px;flex:none;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#pop .pt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#pop .prow .star{margin:0 -4px 0 0}
#pop .prow img,#pop .prow i{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:var(--field)}
@media (prefers-reduced-motion:no-preference){#pop{animation:popin .18s ease-out}}
@keyframes popin{from{transform:translateY(12px);opacity:0}}
.x{background:none;border:0;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 2px 4px 10px}
.day{font-weight:700;padding:16px 0 4px;border-bottom:1px solid var(--line);font-size:.95rem}
.ev{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);color:inherit;text-decoration:none;align-items:flex-start}
.ev .t{width:46px;flex:none;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;padding-top:1px}
.ev img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none;background:var(--field)}
.err{color:var(--danger)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}
.dot.wait{background:var(--accent);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
</style>
<script>["gesturestart","gesturechange","gestureend"].forEach(function(ev){document.addEventListener(ev,function(e){if(!(e.target.closest&&e.target.closest('#map')))e.preventDefault();},{passive:false});});</script>

<body>
<main>
  <div class="top"><a href="../" aria-label="Til MultiApps">‹</a><h1>Begivenheder</h1><button class="iconbtn" id="gear" aria-label="Indstillinger" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>

  <!-- Indstillinger (skjult, åbnes med tandhjulet) -->
  <section id="settings" class="hidden">
    <div class="row first"><span class="grow">Hent kalendere og Google nu</span><button class="link" id="updNow">Opdatér</button></div>

    <div class="row"><span class="meta grow">Prioriterede byer – opdateres oftest</span></div>

    <div class="row"><div class="grow"><div>GitHub</div></div><input class="plain" id="ghKey" type="password" placeholder="github_pat_…" autocomplete="off" style="max-width:52%;text-align:right"></div>

  </section>

  <!-- Én linje: søg i begivenheder, periode, min position -->
  <div class="bar">

  </div>
  <div id="datePanel" class="hidden">
    <div class="presets"><button data-p="0">I dag</button><button data-p="1">I morgen</button><button data-p="w">Weekend</button><button data-p="uge">Denne uge</button><button data-p="7">7 dage</button><button data-p="30">30 dage</button></div>
    <div class="cal" id="cal"></div>

    <input type="hidden" id="from"><input type="hidden" id="to">
  </div>
  <div class="filters" id="filters"></div>

</main>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const isoDay = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parseDay = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const DAYS = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'], MON = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
function km(a, b, c, d){ const R = 6371, r = x => x * Math.PI / 180, dl = r(c - a), dg = r(d - b), h = Math.sin(dl / 2) ** 2 + Math.cos(r(a)) * Math.cos(r(c)) * Math.sin(dg / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
function geohash(lat, lon, prec){
  const B = '0123456789bcdefghjkmnpqrstuvwxyz'; let la = [-90, 90], lo = [-180, 180], h = '', bit = 0, ch = 0, even = true;
  while (h.length < prec) { const r = even ? lo : la, v = even ? lon : lat, mid = (r[0] + r[1]) / 2; if (v >= mid) { ch |= 16 >> bit; r[0] = mid; } else r[1] = mid; even = !even; if (++bit === 5) { h += B[ch]; bit = 0; ch = 0; } }
  return h;
}

/* ---------- Tilstand ---------- */
const today = new Date(); today.setHours(0, 0, 0, 0);
// Området er det, man kan se på kortet: flyt og zoom kortet, så følger listen med
const S = Object.assign({lat: 54.9095, lng: 9.7923, z: 11, place: null}, LS.get('beg:view') || {});
$('#from').value = isoDay(today); $('#to').value = isoDay(addDays(today, 30));
$('#from').min = isoDay(today);
setTimeout(() => dateLabel());
$('#tmKey').value = LS.get('beg:tmkey') || '';
const saveArea = () => LS.set('beg:view', {lat: S.lat, lng: S.lng, z: S.z, place: S.place});

/* ---------- Kort ---------- */

/* ---------- Kilder ----------
   Hver kilde returnerer [{src, id, title, day:'YYYY-MM-DD', time:'HH:MM'|'', venue, city, lat, lng, url, img, cat}].
   Ticketmaster: søger direkte på punkt + radius. Giver en søgning over 1.000 resultater, deles perioden op,
   så intet falder fra (API'et viser højst 1.000 pr. søgning). */
async function ticketmaster(q, onProgress){

    for (let tries = 0; tries < 4; tries++) {
      const wait = 220 - (Date.now() - last); if (wait > 0) await sleep(wait);   // højst ~5 kald i sekundet
      last = Date.now(); calls++;
      let r;
      try { r = await fetch(u); } catch (e) { throw new Error('Nøglen blev afvist – brug "Consumer Key"'); }
      if (r.status === 429) { await sleep(1200); continue; }
      if (r.status === 401) throw Object.assign(new Error('Nøglen virker ikke'), {key: true});
      if (!r.ok) throw new Error('Fejl ' + r.status);
      return r.json();
    }
    throw new Error('For mange kald – prøv igen om lidt');
  };
  const range = async (a, b) => {
    for (let page = 0; ; page++) {
      const j = await call(a, b, page), total = (j.page && j.page.totalElements) || 0;
      if (page === 0 && total > 1000 && b - a > 6 * 3600e3) {
        const mid = new Date(a.getTime() + (b - a) / 2); await range(a, mid); await range(new Date(mid.getTime() + 1000), b); return;
      }
      for (const e of (j._embedded && j._embedded.events) || []) {
        const v = (e._embedded && e._embedded.venues && e._embedded.venues[0]) || {}, st = (e.dates && e.dates.start) || {};
        const img = (e.images || []).filter(i => i.width >= 100).sort((x, y) => x.width - y.width)[0];
        items.push({src: 'Ticketmaster', id: 'tm:' + e.id, title: e.name, day: st.localDate || (st.dateTime || '').slice(0, 10), time: (st.localTime || '').slice(0, 5),
          venue: v.name || '', city: (v.city && v.city.name) || '', lat: v.location ? +v.location.latitude : null, lng: v.location ? +v.location.longitude : null,
          url: e.url, img: img ? img.url : '', desc: String(e.info || e.pleaseNote || '').slice(0, 300), cat: (e.classifications && e.classifications[0] && e.classifications[0].segment && e.classifications[0].segment.name) || ''});
      }
      onProgress && onProgress(items.length);
      const pages = (j.page && j.page.totalPages) || 0;
      if (page + 1 >= pages || (page + 1) * 200 >= 1000) break;
    }
  };
  await range(q.from, q.to);
  return {status: 'ok', items, calls};
}

  const v = viewQuery(), q = {lat: v.lat, lng: v.lng, r: Math.min(400, v.r * 1.6), from: parseDay($('#from').value), to: new Date(parseDay($('#to').value).getTime() + 86400e3 - 1000)};
  lastTM = ($('#tmKey').value || '').trim() ? q : null;

    const place = S.place || {};
    const rows = SOURCES.map(s => {
      const x = st[s.name] || {state: 'wait'};
      const txt = x.state === 'wait' ? 'søger…' + (x.n ? ' ' + x.n : '') : x.state === 'nokey' ? 'mangler nøgle (se Kilder)' : x.state === 'err' ? `<span class="err">${esc(x.msg)}</span>` : x.n + ' fundet' + (x.unplaced ? ` · ${x.unplaced} uden sted` : '');

    });
    const city = place.city || place.muni;
    const gs = ((KILDER && KILDER.google && KILDER.google.steder) || []).map(x => x.toLowerCase());
    if (city && !gs.includes(city.toLowerCase())) rows.push(`<div class="row"><span class="dot"></span><span class="grow">Google: ${esc(city)} er ikke med</span><button class="link" data-addg="${esc(city)}">Tilføj</button></div>`);
    $('#srcs').innerHTML = rows.join('');
    const ag = $('#srcs [data-addg]'); if (ag) ag.onclick = () => { const v = ag.dataset.addg; saveKilder(k => { k.google = k.google || {}; k.google.steder = [...new Set((k.google.steder || []).concat([v]))]; }); };
  };
  renderSrcLast = renderSrc;
  renderSrc(); hidePop();
  reverse().then(() => { if (id === runId) renderSrc(); });
  const all = [];
  const fromStr = isoDay(q.from);
  await Promise.all(SOURCES.map(async s => {
    st[s.name] = {state: 'wait'};
    try {
      const res = await s.fn(q, n => { if (id === runId) { st[s.name].n = n; renderSrc(); } });
      if (id !== runId) return;
      if (res.status === 'nokey') { st[s.name] = {state: 'nokey'}; renderSrc(); return; }

  }));
}

let EVS = [];
function dedupe(list){
  // Samme begivenhed fra flere kilder (eller flere billettyper) vises én gang: nøgle = titel + dag + tid.
  // Mangler tiden hos én kilde, lægges den sammen med samme titel og dag fra en anden.

/* ---------- Filtre ----------
   Hver begivenhed får en eller flere kategorier ud fra kildens egne kategorier (OpdagDanmark, Ticketmaster) og ord i
   titel og beskrivelse. Filterlinjen viser kun de kategorier, der findes blandt det, man kan se, med antal. */
const CATDEF = [
  ['Musik', /koncert|concert|musik|music|jazz|rock|\bpop\b|band|blues|klassisk|orkester|symfoni|opera|\bdj\b|singer|songwriter|guitar|klaver|piano/i, ['Musik', 'Music']],
  ['Teater & show', /teater|theat|musical|forestilling|\bshow\b|stand.?up|comedy|komik|revy|cirkus|ballet|\bdans/i, ['Teater', 'Arts & Theatre']],
  ['Børn & familie', /børn|\bbarn|familie|kids|family|baby|junior|børne|skoleferie/i, ['Børn', 'Family']],
  ['Sang & kor', /fællessang|morgensang|\bkor\b|choir|\bsyng|salme|sangaften|højskolesang/i, []],
  ['Marked', /marked|loppe|market|bazar|basar/i, ['Markeder']],
  ['Mad & drikke', /\bmad|food|smagning|tasting|\bøl\b|\bvin\b|beer|wine|brunch|middag|spisning|bagning/i, ['Mad']],
  ['Foredrag', /foredrag|lecture|debat|oplæsning|forfatter|litteratur|samtale|talk\b|seminar|webinar|livestream/i, ['Foredrag']],
  ['Udstilling & kunst', /udstilling|exhibition|kunst|\bart\b|galleri|gallery|museum|fernisering|maleri/i, ['Kunst', 'Historie']],
  ['Natur & ture', /\btur\b|vandring|guidet|guided|natur|fugle|skov|strand|rundvisning|byvandring|sejltur/i, ['Natur', 'Guidede ture']],
  ['Sport', /fodbold|håndbold|\bløb\b|sport|\bmatch\b|cykel|golf|svøm|ishockey|basket|motion/i, ['Sports']],
  ['Film', /\bfilm|biograf|cinema|movie|kino/i, ['Film']],
  ['Jul', /\bjul|christmas|advent|nisse|lucia/i, ['Jul']],
  ['Fest & festival', /festival|\bfest\b|party|fejring|jubilæum/i, ['Festival']],
];
function catsOf(e){
  if (e._cats) return e._cats;
  const txt = (e.title || '') + ' ' + (e.desc || ''), src = [].concat(e.cats || [], e.cat ? [e.cat] : []);
  const out = CATDEF.filter(([, re, names]) => names.some(n => src.includes(n)) || re.test(txt)).map(([n]) => n);
  return (e._cats = out.length ? out : ['Andet']);
}
let FILT = new Set(LS.get('beg:filt') || []);
const passes = e => !FILT.size || catsOf(e).some(c => FILT.has(c));
const ICON = {'Musik': '🎵', 'Teater & show': '🎭', 'Børn & familie': '🧸', 'Sang & kor': '🎤', 'Marked': '🛍️', 'Mad & drikke': '🍽️', 'Foredrag': '💬', 'Udstilling & kunst': '🖼️', 'Natur & ture': '🌿', 'Sport': '⚽', 'Film': '🎬', 'Jul': '🎄', 'Fest & festival': '🎉', 'Andet': '•'};
let showAllF = false;
function renderFilters(base){
  const cnt = {};
  for (const e of base) for (const c of catsOf(e)) cnt[c] = (cnt[c] || 0) + 1;
  let order = Object.keys(cnt).filter(c => c !== 'Andet').sort((a, b) => cnt[b] - cnt[a]).concat(cnt['Andet'] ? ['Andet'] : []);
  for (const c of FILT) if (!cnt[c]) order.push(c);                      // valgte filtre bliver stående, også med 0
  // De 6 største vises altid (plus de valgte); resten bag "Flere"
  const hidden = [];
  const btn = c => `<button data-f="${esc(c)}" aria-pressed="${FILT.has(c)}"><span>${ICON[c] || '•'}</span>${esc(c)}<span class="n">${cnt[c] || 0}</span></button>`;
  $('#filters').innerHTML = base.length || FILT.size ? (FILT.size ? '<button data-f="" class="more">✕ Ryd</button>' : '') + order.map(btn).join('')
 : '';
}
$('#filters').onclick = e => {
  const m = e.target.closest('[data-more]'); if (m) { showAllF = m.dataset.more === '1'; renderFilters(lastBaseView); return; }
  const b = e.target.closest('[data-f]'); if (!b) return;
  const f = b.dataset.f;
  if (!f) FILT.clear(); else if (FILT.has(f)) FILT.delete(f); else FILT.add(f);
  LS.set('beg:filt', [...FILT]); hidePop();
  // Øjeblikkeligt: knapper og liste først, prikkerne på kortet lige efter
  renderFilters(lastBaseView); requestAnimationFrame(() => draw());
};
let FROM = '';
const eff = e => e.day < FROM ? FROM : e.day;                              // flerdagsbegivenhed, der allerede er i gang
function render(list, fromStr){
  FROM = fromStr;
  ALLEVS = dedupe(list).sort((a, b) => (eff(a) + (a.time || '99')).localeCompare(eff(b) + (b.time || '99')) || a.title.localeCompare(b.title, 'da'));
  draw();
}
// Tegn kort og liste efter fanen: "Alle" (gemte markeret) eller kun "Gemte"
let BASE = [], lastBaseView = [];
function draw(){
  const n = Object.keys(SAVED).length; $('#savedN').textContent = n ? ' ' + n : '';
  if (MODE === 'saved') {
    EVS = Object.values(SAVED).map(x => Object.assign({}, x, {srcs: new Set(x.srcs || []), saved: true}))
      .sort((a, b) => (a.day + (a.time || '99')).localeCompare(b.day + (b.time || '99')));
  } else { EVS = ALLEVS; for (const e of EVS) e.saved = !!SAVED[keyOf(e)]; }
  if (QRY.length) EVS = EVS.filter(matchesQ);
  BASE = EVS;
  if (FILT.size) EVS = EVS.filter(passes);
  evLayer.clearLayers();
  const spots = new Map();
  EVS.forEach((e, i) => { if (e.approx || e.lat == null) return; const k = (+e.lat).toFixed(4) + ',' + (+e.lng).toFixed(4); if (!spots.has(k)) spots.set(k, []); spots.get(k).push(i); });
  const markers = [];
  for (const idx of spots.values()) {
    const e0 = EVS[idx[0]], n = idx.length, sv = idx.filter(i => EVS[i].saved).length;
    const cls = 'pin' + (n === 1 ? ' one' : '') + (sv && (n === 1 || sv === n) ? ' saved' : sv ? ' hasSaved' : '');
    const icon = L.divIcon({className: '', html: `<div class="${cls}">${n > 1 ? (n > 99 ? '99+' : n) : ''}</div>`, iconSize: n === 1 ? [22, 22] : [28, 28], iconAnchor: n === 1 ? [11, 11] : [14, 14]});
    markers.push(L.marker([e0.lat, e0.lng], {icon, keyboard: false, n, idx, sv, zIndexOffset: sv ? 1000 : 0}).on('click', () => showPop(idx)));
  }
  if (evLayer.addLayers) evLayer.addLayers(markers); else markers.forEach(m => m.addTo(evLayer));
  renderList();
}
// Listen: begivenhederne i det, man kan se på kortet
function renderList(){
  const b = map.getBounds();
  EVS.forEach(e => { e.inView = b.contains([e.lat, e.lng]); });
  const vb = map.getBounds(), baseView = MODE === 'saved' ? BASE : BASE.filter(e => e.lat != null && vb.contains([e.lat, e.lng]));
  lastBaseView = baseView; renderFilters(baseView);
  const evs = MODE === 'saved' ? EVS : EVS.filter(e => e.inView);
  $('#resHead').textContent = MODE === 'saved' ? (evs.length ? evs.length + ' gemt' + (evs.length === 1 ? '' : 'e') : Object.keys(SAVED).length ? 'Ingen gemte passer' : 'Ingen gemte endnu')
    : evs.length ? evs.length + (evs.length === 1 ? ' begivenhed' : ' begivenheder') : 'Ingen begivenheder her';
  let html = '', lastDay = '';
  for (const e of evs.slice(0, 600)) {
    const dd = MODE === 'saved' ? e.day : eff(e);
    if (dd !== lastDay) { lastDay = dd; html += `<div class="day">${dayLabel(lastDay)}</div>`; }
    const where = [e.venue, e.city].filter(Boolean).join(', ');
    const span = e.dayEnd ? ' · t.o.m. ' + dayLabel(e.dayEnd).replace(/^\S+ /, '') : '';
    html += `<div class="ev${e.saved ? ' saved' : ''}" id="ev${EVS.indexOf(e)}" data-go="${EVS.indexOf(e)}" role="button" tabindex="0"><span class="t">${esc(e.time || '')}</span><div class="grow"><div class="name">${esc(e.title)}</div><div class="meta">${esc(where)}${span}${e.cat && e.cat !== 'Undefined' ? ' · ' + esc(e.cat) : ''} · ${esc([...e.srcs].join(', '))}</div>${e.url ? `<button class="openbtn" data-open="${EVS.indexOf(e)}">Åbn</button>` : ''}</div>${e.img ? `<img src="${esc(e.img)}" alt="" loading="lazy">` : ''}${starBtn(e, EVS.indexOf(e))}</div>`;
  }
  if (evs.length > 600) html += `<p class="meta" style="margin:12px 0">+ ${evs.length - 600} flere – zoom ind på kortet</p>`;
  $('#list').innerHTML = html;
}
// Tryk på en begivenhed i listen: kortet glider hen til stedet i en passende zoom, og stedets popup åbnes
function focusEvent(i){
  const e = EVS[i]; if (!e || e.lat == null) return;
  const z = Math.min(16, Math.max(14, map.getZoom()));
  const same = EVS.map((x, j) => j).filter(j => EVS[j].lat != null && Math.abs(EVS[j].lat - e.lat) < 1e-4 && Math.abs(EVS[j].lng - e.lng) < 1e-4);
  document.querySelector('.mapwrap').scrollIntoView({behavior: 'smooth', block: 'start'});
  let shown = false; const show = () => { if (!shown) { shown = true; showPop(same.length ? same : [i], null, false, i); } };
  map.once('moveend', () => setTimeout(show, 50)); setTimeout(show, 1200);
  map.flyTo([e.lat, e.lng], z, {duration: .6});
}
$('#list').addEventListener('click', ev => {
  const o = ev.target.closest('[data-open]'); if (o) { const e = EVS[+o.dataset.open]; if (e) openWeb(e.url, e.title); return; }
  const el = ev.target.closest('[data-go]'); if (el && !ev.target.closest('[data-star]')) focusEvent(+el.dataset.go);
});
// Hjemmesider åbnes i en popup oven på appen. Nogle sider tillader ikke det – så bruges "Åbn i Safari".
function openWeb(url, title){
  if (!url || url === '#') return;
  $('#webTitle').textContent = title || ''; $('#webOut').href = url;
  $('#webFrame').src = url; $('#web').classList.remove('hidden'); document.body.style.overflow = 'hidden';
}
function closeWeb(){ $('#web').classList.add('hidden'); $('#webFrame').src = 'about:blank'; document.body.style.overflow = ''; }
$('#webX').onclick = closeWeb;
$('#web').addEventListener('click', e => { if (e.target.id === 'web') closeWeb(); });
$('#pop').addEventListener('click', ev => {
  const a = ev.target.closest('a.prow'); if (!a || ev.target.closest('[data-star]')) return;
  ev.preventDefault(); clearFocus(); openWeb(a.getAttribute('href'), a.querySelector('.pt') && a.querySelector('.pt').textContent);
});
$('#gear').onclick = () => { const p = $('#settings'), open = p.classList.toggle('hidden'); $('#gear').setAttribute('aria-expanded', !open); };
$('#tmKey').onchange = e => { LS.set('beg:tmkey', e.target.value.trim()); search(); };

/* ---------- Kalendere og Google-byer ----------
   Listen ligger i begivenheder/kilder.json i repoet. Ændringer gemmes med en GitHub-nøgle (samme som i Kursvagt),
   og Actionen startes, så de nye begivenheder er med efter et par minutter. */
const REPO = 'AjdinkvBeta/MultiApps', KPATH = 'begivenheder/kilder.json';
const ghKey = () => { try { return localStorage.getItem('kv-ghtoken') || ''; } catch (e) { return ''; } };
$('#ghKey').value = ghKey();
$('#ghKey').onchange = e => { try { localStorage.setItem('kv-ghtoken', e.target.value.trim()); } catch (er) {} };
let KILDER = null, busy = false;
fetch('kilder.json?t=' + Date.now(), {cache: 'no-store'}).then(r => r.json()).then(k => { KILDER = k; renderKilder(); }).catch(() => {});
function msg(t){ $('#gUse').innerHTML = t; $('#updMsg').innerHTML = busy ? t : ''; }
function renderKilder(){
  const k = KILDER || {kalendere: [], google: {steder: []}}, src = (DATA && DATA.sources) || {}, info = {};
  for (const c of src.kalendere || []) info[c.url] = c;
  $('#cals').innerHTML = (k.kalendere || []).map((c, i) => { const x = info[c.url];
    return `<div class="row"><div class="grow"><div class="name">${esc(c.navn || (x && x.navn) || c.url)}</div><div class="meta">${x ? (x.err ? `<span class="err">${esc(x.err)}</span>` : x.n + ' begivenheder') : 'hentes ved næste opdatering'}</div></div><button class="x" data-cal="${i}" aria-label="Fjern">×</button></div>`; }).join('');
  const g = src.google || {}, up = g.opdateret || {};
  $('#gAll').checked = (k.google || {}).heleLandet !== false;
  $('#gWhole').textContent = g.byer ? `${g.hentet || 0} af ${g.byer} byer hentet` : 'Søger byer i hele Danmark på skift';
  $('#gplaces').innerHTML = ((k.google || {}).steder || []).map((p, i) => `<div class="row"><div class="grow"><div>${esc(p)}</div><div class="meta">${up[p] ? 'opdateret ' + new Date(up[p]).toLocaleString('da-DK', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : 'hentes ved næste opdatering'}</div></div><button class="x" data-g="${i}" aria-label="Fjern">×</button></div>`).join('');
  if (!busy) msg(g.status === 'nokey' ? '<span class="err">GitHub kan ikke se SerpApi-nøglen.</span> Den skal ligge under Settings → Secrets and variables → Actions → Repository secrets med navnet SERPAPI_KEY.' : g.status ? `${g.left != null ? g.left + ' søgninger tilbage' : g.used + ' brugt'} denne måned${g.limit ? ' (af ' + g.limit + ')' : ''}${g.err ? ' · <span class="err">' + esc(g.err) + '</span>' : ''}` : '');
}
async function gh(path, opt){
  const r = await fetch('https://api.github.com/repos/' + REPO + path, Object.assign({}, opt, {headers: {Authorization: 'Bearer ' + ghKey(), Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'}}));
  if (!r.ok) { const t = r.status === 401 || r.status === 403 ? 'GitHub-nøglen virker ikke' : 'GitHub-fejl ' + r.status; throw new Error(t); }
  return r.status === 204 ? null : r.json();
}
// Gem ændringen i kilder.json (hvis der er en) og start indsamlingen
async function saveKilder(change, label){
  if (!ghKey()) { msg('<span class="err">Indsæt en GitHub-nøgle under Nøgler først.</span>'); return false; }
  busy = true; msg((label || 'Gemmer') + '…');
  try {
    if (change) {
      const cur = await gh('/contents/' + KPATH + '?ref=main');
      const k = JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g, '')))));
      change(k);
      await gh('/contents/' + KPATH, {method: 'PUT', body: JSON.stringify({message: 'Begivenheder: kilder', content: btoa(unescape(encodeURIComponent(JSON.stringify(k, null, 2) + '\n'))), sha: cur.sha, branch: 'main'})});
      KILDER = k;
    }
    await gh('/actions/workflows/kursvagt.yml/dispatches', {method: 'POST', body: JSON.stringify({ref: 'main', inputs: {beg: '1'}})});
    renderKilder(); msg('Henter begivenheder – det tager et par minutter…');
    const before = DATA && DATA.updatedAt;
    for (let i = 0; i < 24; i++) { await sleep(20000); const d = await loadData(true); if (d && d.updatedAt !== before) { busy = false; renderKilder(); search(); return true; } }
    busy = false; renderKilder();
  } catch (e) { busy = false; msg('<span class="err">' + esc(e.message) + '</span>'); return false; }
  return true;
}
$('#updNow').onclick = async () => {
  search();
  if (!ghKey()) { $('#updMsg').innerHTML = 'Ticketmaster er opdateret. Kalendere og Google opdateres af sig selv ca. hver halve time – med en GitHub-nøgle under Nøgler kan de hentes med det samme.'; return; }
  $('#updNow').disabled = true;
  await saveKilder(null, 'Henter nu');
  $('#updNow').disabled = false; $('#updMsg').textContent = DATA && DATA.updatedAt ? 'Hentet ' + new Date(DATA.updatedAt).toLocaleString('da-DK', {day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'}) : '';
};
$('#calAdd').onclick = () => {
  const u = $('#calIn').value.trim(); if (!/^(https?|webcal):\/\//i.test(u)) { msg('<span class="err">Linket skal starte med https:// eller webcal://</span>'); return; }
  saveKilder(k => { k.kalendere = (k.kalendere || []).filter(c => c.url !== u).concat([{url: u}]); }).then(ok => { if (ok) $('#calIn').value = ''; });
};
$('#gAdd').onclick = () => {
  const v = $('#gIn').value.trim(); if (!v) return;
  saveKilder(k => { k.google = k.google || {}; k.google.steder = [...new Set((k.google.steder || []).concat([v]))]; }).then(ok => { if (ok) $('#gIn').value = ''; });
};
$('#cals').onclick = e => { const b = e.target.closest('[data-cal]'); if (!b) return; const u = KILDER.kalendere[+b.dataset.cal].url; saveKilder(k => { k.kalendere = (k.kalendere || []).filter(c => c.url !== u); }); };
$('#gAll').onchange = e => { const v = e.target.checked; saveKilder(k => { k.google = k.google || {}; k.google.heleLandet = v; }).then(ok => { if (!ok) e.target.checked = !v; }); };
$('#gplaces').onclick = e => { const b = e.target.closest('[data-g]'); if (!b) return; const p = KILDER.google.steder[+b.dataset.g]; saveKilder(k => { k.google.steder = (k.google.steder || []).filter(x => x !== p); }); };

search();
})();
</script>
