<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<script src="../persist.js"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<style>html,body,*{touch-action:pan-x pan-y}body{-webkit-text-size-adjust:100%}</style>
<meta name="theme-color" content="#2b333d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kursvagt">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Kursvagt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: phone-first single column (max 760px) — sticky status bar on top, fixed tab bar at the bottom, stock detail as a full-screen sheet. */
:root {
  --bg: #F2F4F6; --surface: #FFFFFF; --surface-2: #E8ECF0; --ink: #0F1A2A; --ink-2: #455163; --ink-3: #6E7A8A; --line: #D8DEE5;
  --accent: #0E5C78; --accent-ink: #FFFFFF; --accent-soft: #DBEDF3;
  --mark: #A86A12; --mark-soft: #F8EBD5;
  --good: #11784A; --good-soft: #DCF2E5; --warn: #A35F00; --warn-soft: #FDEFD6; --bad: #BE342D; --bad-soft: #FAE2DF; --hold: #586374; --hold-soft: #E6EAEF;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-s: 8px; --r-m: 14px;
  --shadow: 0 1px 2px rgba(15,26,42,.06), 0 6px 18px rgba(15,26,42,.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0B121B; --surface: #121B26; --surface-2: #1A2532; --ink: #E7ECF2; --ink-2: #AAB5C3; --ink-3: #7F8B9A; --line: #263345;
  --accent: #55B6D2; --accent-ink: #062431; --accent-soft: #13323E; --mark: #E2A84E; --mark-soft: #3A2A12;
  --good: #3FC283; --good-soft: #12301F; --warn: #EBA341; --warn-soft: #36280F; --bad: #F26D62; --bad-soft: #3B1B19; --hold: #9CA8B7; --hold-soft: #1E2935;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0B121B; --surface: #121B26; --surface-2: #1A2532; --ink: #E7ECF2; --ink-2: #AAB5C3; --ink-3: #7F8B9A; --line: #263345;
  --accent: #55B6D2; --accent-ink: #062431; --accent-soft: #13323E; --mark: #E2A84E; --mark-soft: #3A2A12;
  --good: #3FC283; --good-soft: #12301F; --warn: #EBA341; --warn-soft: #36280F; --bad: #F26D62; --bad-soft: #3B1B19; --hold: #9CA8B7; --hold-soft: #1E2935;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  --shadow: 0 1px 2px rgba(0,0,0,.4); color-scheme: dark; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.num, .tab { font-family: var(--f-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: .98rem; font-weight: 700; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); font-weight: 600; }
.muted { color: var(--ink-3); } .small { font-size: .82rem; } .tiny { font-size: .74rem; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 22px; height: 22px; }
.status { margin-left: auto; text-align: right; font-size: .74rem; color: var(--ink-3); line-height: 1.3; min-width: 0; }
.status b { color: var(--ink-2); font-weight: 600; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 5px; vertical-align: 1px; }
.dot.stale { background: var(--warn); }

main { padding-block: 14px 110px; display: grid; gap: 16px; }
.view[hidden] { display: none !important; }
.view { display: grid; gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* chips & filters */
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: .84rem; cursor: pointer; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip .c { font-family: var(--f-num); font-size: .74rem; opacity: .7; margin-left: 4px; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 10px; border-radius: 8px; font-size: .82rem; cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.filters { display: grid; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search { flex: 1 1 160px; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
select.sel { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 10px; font-size: .85rem; }

/* signal pill */
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px 3px 8px; font-weight: 700; font-size: .8rem; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: currentColor; }
.pill.koeb { background: var(--good-soft); color: var(--good); }
.pill.akk { background: var(--good-soft); color: var(--good); }
.pill.akk::before { border-radius: 50%; background: transparent; border: 2px solid currentColor; width: 6px; height: 6px; }
.pill.hold { background: var(--hold-soft); color: var(--hold); }
.pill.hold::before { height: 3px; border-radius: 2px; }
.pill.red { background: var(--warn-soft); color: var(--warn); }
.pill.red::before { border-radius: 50%; background: transparent; border: 2px solid currentColor; width: 6px; height: 6px; }
.pill.saelg { background: var(--bad-soft); color: var(--bad); }
.pill.big { font-size: 1rem; padding: 6px 14px 6px 12px; }
.up { color: var(--good); } .down { color: var(--bad); }

/* alerts */
.alerts { display: grid; gap: 8px; }
.alert { display: grid; grid-template-columns: 4px 1fr auto; gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px 10px 0; cursor: pointer; text-align: left; width: 100%; }
.alert .stripe { align-self: stretch; border-radius: 0 3px 3px 0; background: var(--hold); }
.alert.mulighed .stripe { background: var(--good); } .alert.risiko .stripe { background: var(--bad); } .alert.begivenhed .stripe { background: var(--mark); } .alert.skat .stripe { background: var(--accent); }
.alert .t { display: block; font-weight: 600; font-size: .9rem; } .alert .d { display: block; font-size: .82rem; color: var(--ink-2); }
.alert .k { display: block; }
.alert .k { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; }
.empty { text-align: center; padding: 18px 10px; color: var(--ink-3); font-size: .9rem; }

/* stock list */
.list { display: grid; }
.srow { display: grid; grid-template-columns: minmax(0, 1fr) 76px auto; gap: 10px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); cursor: pointer; background: transparent; border-left: 0; border-right: 0; border-top: 0; text-align: left; width: 100%; }
.srow:last-child { border-bottom: 0; }
.srow:hover { background: var(--surface-2); }
.srow .nm { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .meta { display: block; font-size: .76rem; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.srow .rt { text-align: right; display: grid; gap: 3px; justify-items: end; }
.srow .kv { display: block; font-size: .76rem; color: var(--ink-3); }
.srow .kv b { font-family: var(--f-num); font-weight: 500; color: var(--ink); }
.spark { width: 76px; height: 30px; display: block; }
.mine { display: inline-block; font-size: .64rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .kpis.k3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; min-width: 0; }
.kpi .l { font-size: .74rem; color: var(--ink-3); font-weight: 600; }
.kpi .v { font-family: var(--f-display); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; overflow-wrap: anywhere; }
.kpi .s { font-size: .76rem; color: var(--ink-2); }
.kpi.hero { grid-column: 1 / -1; }
.kpi.hero .v { font-size: 1.9rem; }

/* sheet (stock detail) */
.sheet { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet-top { position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.sheet-top .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; }
.sheet .body { display: grid; gap: 16px; padding-block: 16px 60px; }
.dhead { display: grid; gap: 4px; }
.dhead .price { font-family: var(--f-display); font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.verdict { display: grid; gap: 12px; }
.verdict .line { font-size: 1rem; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.trio .kpi .v { font-size: 1.15rem; white-space: nowrap; }
.trio .kpi { padding: 10px; }
.action { border-radius: var(--r-s); padding: 12px; background: var(--surface-2); display: grid; gap: 4px; }
.action b { font-family: var(--f-display); font-size: 1.05rem; }

/* reasons */
.reasons { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.reasons li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: .9rem; }
.sg { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-weight: 700; font-family: var(--f-num); font-size: .85rem; }
.sg.p { background: var(--good-soft); color: var(--good); } .sg.n { background: var(--bad-soft); color: var(--bad); } .sg.z { background: var(--hold-soft); color: var(--hold); }

/* probability grid */
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (min-width: 620px) { .pgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.prob { border: 1px solid var(--line); border-radius: var(--r-s); padding: 10px 12px; display: grid; gap: 4px; min-width: 0; }
.prob .v { font-family: var(--f-display); font-weight: 700; font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.prob .bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.prob .bar i { display: block; height: 100%; border-radius: 3px; }
.prob .x { font-size: .78rem; color: var(--ink-2); }

/* ladder */
.ladder { position: relative; }
.ladder svg { width: 100%; display: block; overflow: visible; }

/* charts */
.chart { position: relative; }
.chart svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart text { font-family: var(--f-num); font-size: 10px; fill: var(--ink-3); }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 6px 9px; font-size: .76rem; line-height: 1.35; white-space: nowrap; transform: translate(-50%, -100%); top: 0; left: 0; z-index: 3; font-family: var(--f-num); }
.tip[hidden] { display: none; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: .78rem; color: var(--ink-2); margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
.legend i.dash { background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 7px) !important; height: 2px; }

/* tables */
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-inline: -4px; }
table.t { width: 100%; border-collapse: collapse; font-size: .84rem; }
table.t th { text-align: left; font-weight: 600; font-size: .72rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: default; }
table.t th.sort { cursor: pointer; }
table.t th.sort[aria-sort]::after { content: " ↓"; color: var(--accent); }
table.t th.sort[aria-sort="ascending"]::after { content: " ↑"; }
table.t td { padding: 9px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td.r, table.t th.r { text-align: right; }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.click { cursor: pointer; }
table.t tr.click:hover td { background: var(--surface-2); }
.kv2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
@media (min-width: 620px) { .kv2 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kv2 div { display: flex; justify-content: space-between; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .85rem; }
.kv2 div span:last-child { font-family: var(--f-num); }

/* sliders */
.sl { display: grid; gap: 4px; }
.sl label { display: flex; justify-content: space-between; font-size: .85rem; gap: 8px; }
.sl label b { font-family: var(--f-num); font-weight: 500; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.sliders { display: grid; gap: 14px; }
.result-strip { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; padding: 10px 12px; background: var(--mark-soft); border-radius: var(--r-s); }
.result-strip b { font-family: var(--f-display); font-size: 1.25rem; }

/* news */
.news { display: grid; gap: 10px; }
.nitem { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: .88rem; }
.nitem .when { font-size: .74rem; color: var(--ink-3); }

/* forms */
.form { display: grid; gap: 10px; }
.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .76rem; color: var(--ink-3); font-weight: 600; }
.field input, .field select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
.btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; }
.btn.ghost { background: var(--surface-2); color: var(--ink); }
.btn.sm { padding: 6px 10px; font-size: .82rem; }
.btn:disabled { opacity: .5; cursor: default; }
.toggle { display: flex; align-items: center; gap: 10px; font-size: .9rem; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.banner { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--r-s); background: var(--mark-soft); font-size: .86rem; }
.note { font-size: .8rem; color: var(--ink-2); border-left: 3px solid var(--line); padding-left: 10px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.steps li { display: grid; grid-template-columns: 110px 1fr; gap: 10px; font-size: .88rem; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.steps li:last-child { border-bottom: 0; }
.steps .w { font-weight: 700; color: var(--accent); font-size: .82rem; }
.todo { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.todo li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: .9rem; padding: 10px; background: var(--surface-2); border-radius: var(--r-s); }
.todo .ic { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 700; font-size: .8rem; font-family: var(--f-num); }
.rub { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: .86rem; }
.rub .no { font-family: var(--f-num); font-weight: 500; background: var(--accent-soft); color: var(--accent); border-radius: 6px; text-align: center; padding: 1px 0; }
.rub .amt { font-family: var(--f-num); }
.refs { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: .84rem; }
details.more summary { cursor: pointer; font-weight: 600; font-size: .9rem; color: var(--accent); }
details.more[open] summary { margin-bottom: 10px; }
.formula { font-family: var(--f-num); font-size: .8rem; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; overflow-x: auto; white-space: nowrap; }

.donutgrid { grid-template-columns: minmax(0, 1fr) !important; }
@media (min-width: 560px) { .donutgrid { grid-template-columns: minmax(0, 200px) minmax(0, 1fr) !important; } }
/* bottom tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabbar .in { max-width: 760px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabbar button { border: 0; background: transparent; padding: 8px 4px 9px; display: grid; justify-items: center; gap: 2px; font-size: .72rem; color: var(--ink-3); cursor: pointer; position: relative; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--accent); font-weight: 700; }
.tabbar .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: .62rem; display: grid; place-items: center; padding: 0 4px; font-weight: 700; }
.toast { position: fixed; left: 50%; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: .85rem; z-index: 60; }
.disclaimer { font-size: .76rem; color: var(--ink-3); text-align: center; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .22s ease-out; } @keyframes rise { from { transform: translateY(18px); opacity: .6; } to { transform: none; opacity: 1; } } }

/* ---- readability & sub-tabs (v2) ---- */

<script>// Kursvagt on GitHub Pages – bridge between the app and its data.
// Implements the small window.claude.use("db" | "user" | "downloads") API the app was written against:
//  - market data (stocks, crypto, FX, rules, status) is read from ./data/*.json, which a GitHub Action
//    refreshes on a schedule (see .github/workflows/kursvagt.yml);
//  - your own data (portfolio, favourites/alarms, simulator) lives only in this browser (localStorage),
//    with export/import as backup or to move it to another device;
//  - crypto prices are refreshed live from CoinPaprika in the browser; the ↻ button can also start
//    the GitHub Action right away if you have saved a GitHub token on this device.
(function () {
  var REPO = "AjdinkvBeta/MultiApps", WORKFLOW = "kursvagt.yml";
  var LS = { user: "kvu-", token: "kv-ghtoken" };
  var data = null, subs = { stocks: [], meta: [], macro: [], rules: [] }, userSubs = {}, refreshing = false, lastLoad = 0;

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  function getJSON(url) { return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status + " " + url); return r.json(); }); }
  function snapDoc(id, d) { return { id: id, exists: d != null, data: function () { return d; } }; }
  function toast(t) { if (window.__kvToast) window.__kvToast(t); }

  function emit(name) {
    if (!data) return;
    if (name === "stocks") {
      var docs = [];
      Object.keys(data.stocks).forEach(function (g) { (data.stocks[g] || []).forEach(function (d) { docs.push(snapDoc(d.id, d)); }); });
      subs.stocks.forEach(function (cb) { cb({ docs: docs }); });
    } else subs[name].forEach(function (cb) { cb(snapDoc(name, data[name])); });
  }
  function emitAll() { ["stocks", "meta", "macro", "rules"].forEach(emit); }

  // ---------- load market data ----------
  function load() {
    return getJSON("data/index.json?t=" + Date.now()).then(function (idx) {
      var v = encodeURIComponent(idx.updatedAt || Date.now());
      var parts = idx.groups.map(function (g) { return getJSON("data/" + g.g + ".json?v=" + v).then(function (arr) { return [g.g, arr]; }); });
      return Promise.all([Promise.all(parts), getJSON("data/macro.json?v=" + v), getJSON("data/rules.json?v=" + v), getJSON("data/meta.json?v=" + v)]).then(function (r) {
        var st = {}; r[0].forEach(function (x) { st[x[0]] = x[1]; });
        var old = data;
        data = { idx: idx, stocks: st, macro: r[1], rules: r[2], meta: r[3] };
        if (old && old.live) applyLive(old.live); // keep live crypto prices from this session if newer
        lastLoad = Date.now(); emitAll();
        return idx;
      });
    });
  }

  // ---------- live crypto prices (CoinPaprika allows browser requests) ----------
  function cryptoDocs() { var out = []; Object.keys(data.stocks).forEach(function (g) { if (g.charAt(0) === "c") out = out.concat(data.stocks[g]); }); return out; }
  function applyLive(live) {
    data.live = live;
    cryptoDocs().forEach(function (d) {
      var q = live[d.paprikaId]; if (!q || !(q.price > 0)) return;
      if (d.priceDate && q.date < d.priceDate) return;
      d.price = q.price; d.priceDate = q.date; if (q.chg != null) d.chg24h = q.chg;
      var D = d.dailyD, C = d.dailyC, i = D.indexOf(q.date);
      if (i >= 0) C[i] = q.price; else if (!D.length || q.date > D[D.length - 1]) { D.push(q.date); C.push(q.price); }
      var ym = q.date.slice(0, 7);
      if (d.monthlyD[d.monthlyD.length - 1] === ym) d.monthlyC[d.monthlyC.length - 1] = q.price; else if (ym > d.monthlyD[d.monthlyD.length - 1]) { d.monthlyD.push(ym); d.monthlyC.push(q.price); }
    });
  }
  function refreshCrypto() {
    var docs = cryptoDocs().filter(function (d) { return d.paprikaId; }), live = (data.live || {}), i = 0, ok = 0;
    function worker() {
      if (i >= docs.length) return Promise.resolve();
      var d = docs[i++];
      return getJSON("https://api.coinpaprika.com/v1/tickers/" + d.paprikaId).then(function (t) {
        var q = t.quotes && t.quotes.USD; if (!q || !(q.price > 0)) return;
        live[d.paprikaId] = { price: q.price, chg: typeof q.percent_change_24h === "number" ? q.percent_change_24h / 100 : null, date: (t.last_updated || new Date().toISOString()).slice(0, 10) };
        ok++;
      }, function () {}).then(worker);
    }
    return Promise.all([worker(), worker(), worker(), worker()]).then(function () { if (ok) { applyLive(live); emit("stocks"); } return ok; });
  }

  // ---------- start the GitHub Action (optional, needs a token saved on this device) ----------
  function dispatch() {
    var tok = lsGet(LS.token); if (!tok) return Promise.resolve(false);
    return fetch("https://api.github.com/repos/" + REPO + "/actions/workflows/" + WORKFLOW + "/dispatches", {
      method: "POST", headers: { Authorization: "Bearer " + tok, Accept: "application/vnd.github+json", "Content-Type": "application/json" },
      body: JSON.stringify({ ref: "main" })
    }).then(function (r) { if (r.status === 204) return true; if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error("GitHub-nøglen virker ikke (" + r.status + ")"); throw new Error("GitHub svarede " + r.status); });
  }
  function waitForNewData(prev, tries) {
    if (tries <= 0) { toast("Opdateringen kører stadig på GitHub – nye kurser kommer om lidt"); return; }
    setTimeout(function () {
      getJSON("data/index.json?t=" + Date.now()).then(function (idx) {
        if (idx.updatedAt && idx.updatedAt !== prev) return load().then(function () { toast("Nye aktiekurser hentet"); });
        waitForNewData(prev, tries - 1);
      }, function () { waitForNewData(prev, tries - 1); });
    }, 30000);
  }

  function setStatus(txt) { var el = document.getElementById("status"); if (el && txt) el.innerHTML = '<span class="dot"></span>' + txt; }
  function spin(on) { var b = document.getElementById("refreshBtn"); if (b) b.classList.toggle("spin", !!on); }
  function refresh(manual) {
    if (refreshing) return Promise.resolve();
    refreshing = true; spin(true); setStatus("Henter…");
    var prev = data && data.idx && data.idx.updatedAt, dispatched = false;
    return load().then(refreshCrypto).then(function () {
      if (!manual) return;
      return dispatch().then(function (d) { dispatched = d; }, function (e) { toast(e.message); });
    }).then(function () {
      refreshing = false; spin(false); emit("meta");
      if (manual) {
        if (dispatched) { toast("Krypto opdateret · aktiekurser hentes på GitHub (1–3 min.)"); waitForNewData(data.idx.updatedAt, 10); }
        else toast("Opdateret · aktiekurser opdateres automatisk ca. hver halve time");
      }
    }, function (e) { refreshing = false; spin(false); emit("meta"); toast("Kunne ikke hente data: " + e.message); });
  }
  window.kvRefresh = function () { return refresh(true); };
  setInterval(function () { if (document.visibilityState === "visible" && Date.now() - lastLoad > 10 * 60e3) refresh(false); }, 60e3);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && Date.now() - lastLoad > 5 * 60e3) refresh(false); });

  // ---------- your own data: this browser only ----------
  var USER_DOCS = ["portfolio", "prefs", "sim"];
  function readUser(name) { var t = lsGet(LS.user + name); try { return t ? JSON.parse(t) : null; } catch (e) { return null; } }
  function writeUser(name, obj) { lsSet(LS.user + name, JSON.stringify(obj)); }
  function importObj(o) {
    var n = 0;
    USER_DOCS.forEach(function (k) { if (o && o[k] && typeof o[k] === "object") { writeUser(k, o[k]); n++; } });
    if (!n) throw new Error("Filen indeholder ingen Kursvagt-data");
    return n;
  }
  // one-time import link: …/kursvagt/#import=<base64 json>
  (function () {
    var m = (location.hash || "").match(/^#import=(.+)$/);
    if (!m) return;
    try { var json = decodeURIComponent(escape(atob(decodeURIComponent(m[1])))); importObj(JSON.parse(json)); setTimeout(function () { toast("Dine data er importeret"); }, 1500); }
    catch (e) { setTimeout(function () { toast("Import mislykkedes"); }, 1500); }
    history.replaceState(null, "", location.pathname);
  })();

  window.kvPagesPanel = function () {
    var tok = !!lsGet(LS.token);
    return '<div style="margin-top:14px;display:grid;gap:8px"><p class="small"><b>Dine egne data</b> (portefølje, favoritter, alarmer og simulering) gemmes kun i denne browser. Tag en sikkerhedskopi, eller flyt dem til en anden enhed med eksport og import.</p>' +
      '<div class="row"><button type="button" class="btn ghost sm" data-act="kvp" data-v="export">Eksportér mine data</button><button type="button" class="btn ghost sm" data-act="kvp" data-v="import">Importér</button></div>' +
      '<p class="small"><b>Aktiekurser nu.</b> ' + (tok ? "Der er gemt en GitHub-nøgle på denne enhed – ↻ starter opdateringen på GitHub med det samme." : "Aktiekurser opdateres automatisk ca. hver halve time. Gem en GitHub-nøgle, hvis ↻ også skal hente aktiekurser med det samme.") + "</p>" +
      '<div class="row"><button type="button" class="btn ghost sm" data-act="kvp" data-v="token">' + (tok ? "Skift GitHub-nøgle" : "Gem GitHub-nøgle") + "</button>" + (tok ? '<button type="button" class="btn ghost sm" data-act="kvp" data-v="notoken">Fjern nøgle</button>' : "") + "</div></div>";
  };
  window.kvPagesAction = function (v) {
    if (v === "export") {
      var o = { app: "kursvagt", exported: new Date().toISOString() };
      USER_DOCS.forEach(function (k) { o[k] = readUser(k); });
      downloads.save({ filename: "kursvagt-data-" + new Date().toISOString().slice(0, 10) + ".json", data: JSON.stringify(o, null, 1) });
    } else if (v === "import") {
      var inp = document.createElement("input"); inp.type = "file"; inp.accept = "application/json,.json";
      inp.onchange = function () {
        var f = inp.files && inp.files[0]; if (!f) return;
        f.text().then(function (t) { importObj(JSON.parse(t)); toast("Data importeret – genindlæser"); setTimeout(function () { location.reload(); }, 900); }).catch(function (e) { toast("Import mislykkedes: " + e.message); });
      };
      inp.click();
    } else if (v === "token") {
      var t = prompt("Indsæt din GitHub-nøgle (fine-grained token med Actions: Read and write på repoet MultiApps). Den gemmes kun på denne enhed.");
      if (t && t.trim()) { lsSet(LS.token, t.trim()); toast("Nøglen er gemt"); if (window.__kvRender) window.__kvRender(); }
    } else if (v === "notoken") { lsSet(LS.token, null); toast("Nøglen er fjernet"); if (window.__kvRender) window.__kvRender(); }
  };

  // ---------- API the app expects ----------
  function userDoc(name) {
    return {
      onSnapshot: function (cb) { (userSubs[name] = userSubs[name] || []).push(cb); setTimeout(function () { cb(snapDoc(name, readUser(name))); }, 0); return function () {}; },
      set: function (body) { writeUser(name, body); return Promise.resolve(); }
    };
  }
  var db = {
    collection: function () { return { onSnapshot: function (cb) { subs.stocks.push(cb); if (data) emit("stocks"); return function () {}; } }; },
    doc: function (path) {
      var m = path.match(/^data\/users\/[^/]+\/(\w+)$/);
      if (m) return userDoc(m[1]);
      var name = { "meta/status": "meta", "macro/current": "macro", "rules/dk": "rules" }[path];
      return { onSnapshot: function (cb) { if (name) { subs[name].push(cb); if (data) cb(snapDoc(name, data[name])); } return function () {}; }, set: function () { return Promise.resolve(); } };
    }
  };
  var user = { id: function () { return Promise.resolve("me"); } };
  var downloads = {
    save: function (o) {
      var blob = new Blob([o.data], { type: /\.json$/.test(o.filename || "") ? "application/json" : "text/plain;charset=utf-8" }), a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = o.filename || "kursvagt.txt"; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      return Promise.resolve();
    }
  };
  // the page itself cannot be zoomed (iOS ignores user-scalable=no, so block the pinch gesture too)
  ["gesturestart", "gesturechange", "gestureend"].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }, { passive: false }); });
  document.addEventListener("touchmove", function (e) { if (e.scale !== undefined && e.scale !== 1) e.preventDefault(); }, { passive: false });

  window.claude = { use: function (n) { return Promise.resolve(n === "db" ? db : n === "user" ? user : n === "downloads" ? downloads : null); } };
  window.KV_WORKER = true; // shows the ↻ button
  load().then(function () { refreshCrypto(); }, function (e) {
    setTimeout(function () { setStatus("Data er ikke klar endnu – første opdatering på GitHub kører måske stadig"); }, 300);
    console.warn(e);
  });
})();
</script>
<script id="engine">/* Aktieanalyse engine — valuation, risk, sizing and Danish tax. Pure functions, no DOM. */
var Engine = (function () {
  "use strict";

  // ---------- math helpers ----------
  function erf(x) {
    // Abramowitz & Stegun 7.1.26
    var s = x < 0 ? -1 : 1; x = Math.abs(x);
    var t = 1 / (1 + 0.3275911 * x);
    var y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-x * x);
    return s * y;
  }
  function Phi(z) { return 0.5 * (1 + erf(z / Math.SQRT2)); }
  function clamp(x, a, b) { return Math.min(b, Math.max(a, x)); }
  function mean(a) { return a.length ? a.reduce(function (s, v) { return s + v; }, 0) / a.length : NaN; }
  function sd(a) { if (a.length < 2) return NaN; var m = mean(a); return Math.sqrt(a.reduce(function (s, v) { return s + (v - m) * (v - m); }, 0) / (a.length - 1)); }
  function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); var n = b.length; if (!n) return NaN; return n % 2 ? b[(n - 1) / 2] : (b[n / 2 - 1] + b[n / 2]) / 2; }
  function num(v) { return typeof v === "number" && isFinite(v); }
  function days(a, b) { return (new Date(b) - new Date(a)) / 864e5; }

  function sma(arr, n) { if (arr.length < n) return NaN; return mean(arr.slice(-n)); }
  function emaSeries(arr, n) { var k = 2 / (n + 1), out = [], e = arr[0]; for (var i = 0; i < arr.length; i++) { e = i === 0 ? arr[0] : arr[i] * k + e * (1 - k); out.push(e); } return out; }
  function rsi(closes, n) {
    n = n || 14; if (closes.length < n + 1) return NaN;
    var g = 0, l = 0, i;
    for (i = 1; i <= n; i++) { var d = closes[i] - closes[i - 1]; if (d > 0) g += d; else l -= d; }
    g /= n; l /= n;
    for (i = n + 1; i < closes.length; i++) { var d2 = closes[i] - closes[i - 1]; g = (g * (n - 1) + Math.max(d2, 0)) / n; l = (l * (n - 1) + Math.max(-d2, 0)) / n; }
    if (l === 0) return 100; var rs = g / l; return 100 - 100 / (1 + rs);
  }
  function macd(closes) {
    if (closes.length < 35) return null;
    var e12 = emaSeries(closes, 12), e26 = emaSeries(closes, 26);
    var line = e12.map(function (v, i) { return v - e26[i]; });
    var sig = emaSeries(line.slice(25), 9);
    var m = line[line.length - 1], s = sig[sig.length - 1];
    return { macd: m, signal: s, hist: m - s };
  }
  function maxDrawdown(p) { var peak = -Infinity, dd = 0; p.forEach(function (v) { peak = Math.max(peak, v); dd = Math.min(dd, v / peak - 1); }); return dd; }

  // ---------- defaults ----------
  var DEFAULTS = {
    erp: 0.045, betaFloor: 0.8, specificPremium: 0.0, cyclicalPremium: 0.015,
    gT: 0.025, baseGrowth: 0.05, years: 10, confidence: 0.5, halfLife: 3,
    kellyFraction: 0.25, maxWeight: 0.10, cash: 0.025, minTrade: 2500, analystBias: 0.10, analystWeight: 1
  };

  function settingsWith(macro, user) {
    var s = {}; Object.keys(DEFAULTS).forEach(function (k) { s[k] = DEFAULTS[k]; });
    if (macro) { if (num(macro.erp)) s.erp = macro.erp; if (num(macro.gT)) s.gT = macro.gT; if (num(macro.cash)) s.cash = macro.cash; }
    if (user) Object.keys(user).forEach(function (k) { if (num(user[k])) s[k] = user[k]; });
    return s;
  }

  // ---------- cost of equity (CAPM + Blume-adjusted beta) ----------
  function costOfEquity(st, macro, s) {
    var rf = (macro.rf && macro.rf[st.currency]) || 0.035;
    var beta = num(st.fund.beta) ? st.fund.beta : 1;

  // ---------- trading plan for a portfolio ----------
  var FEES = {

  // ---------- portfolio & Danish tax ----------
  function buildPortfolio(lots, sales, stocks, macro, opts) {
    opts = opts || {};

      var fx = num(x.fx) ? x.fx : (fxNow[x.currency || "DKK"] || 1);

      var cur = st ? st.currency : "DKK";
      var px = st ? st.price : (opts.manualPrices && opts.manualPrices[b.stockId]) || b.cost / b.qty;
      var value = b.qty * px * (fxNow[cur] || 1);

    });

  }

  function taxYear(pf, stocks, rules, year, opts) {
    opts = opts || {};
    var limit = opts.married ? rules.progressionLimitMarried : rules.progressionLimit;
    var other = opts.otherShareIncome || 0;
    var gains = 0, losses = 0;
    pf.realized.forEach(function (r) { if (r.year === year && r.account === "frit") { if (r.gain >= 0) gains += r.gain; else losses += r.gain; } });
    var carry = opts.lossCarryForward || 0;

    pf.positions.forEach(function (p) { if (p.account === "frit") { unrealized += p.gain; if (p.gain < 0) unrealizedLoss += p.gain; } });

  function saleTax(position, qty, priceDKK, taxInfo, rules) {

      case "alarmquick": addAlarm(el.dataset.id, parseFloat(el.dataset.p)); compute(); renderAll(); break;
      case "alarmdel": S.prefs.alarms = S.prefs.alarms.filter(function (x) { return x.id !== el.dataset.aid; }); savePrefs(); toast("Alarm slettet"); compute(); renderAll(); break;
      case "qsearch": S.f.view = S.f.view || "liste"; S.sub.overview = "stocks"; S.subChosen = true; if (S.detail || S.cmpOpen) closeDetail(); if (S.tab !== "overview") setTab("overview"); else { renderSubbar(); renderView(); } setTimeout(function () { var q = $("q"); if (q) { q.focus(); q.select(); } }, 30); break;
      case "density": if (el.closest(".tbtns")) { var cur = document.documentElement.getAttribute("data-density"), k = DENS.map(function (x) { return x[0]; }).indexOf(cur), nx = DENS[(k + 1) % DENS.length]; setDisplay("kv-density", nx[0]); toast("Tekststørrelse: " + nx[1]); } else setDisplay("kv-density", el.dataset.v); break;
      case "theme": setDisplay("kv-theme", el.dataset.v); break;
      case "gloss": showGloss(el.dataset.k, el); break;
      case "tkside": tk().side = el.dataset.v; renderSim(); break;
      case "tktype": tk().type = el.dataset.v; renderSim(); break;
      case "tkmode": tk().mode = tk().mode === "amount" ? "qty" : "amount"; renderSim(); setTimeout(function () { var q = $("tkQty"); if (q) q.focus(); }, 20); break;
      case "simcancel": S.sim.orders.forEach(function (x) { if (x.id === el.dataset.oid && x.status === "pending") { x.status = "cancelled"; x.ended = new Date().toISOString(); delete x.reserve; } }); saveSim(); compute(); renderAll(); toast("Ordren er annulleret"); break;
      case "simsell": case "simbuy": var tq = tk(), pp = S.simB && S.simB.positions.filter(function (x) { return x.sid === el.dataset.id; })[0]; tq.sid = el.dataset.id; tq.side = act === "simsell" ? "sell" : "buy"; tq.mode = "qty"; tq.qty = act === "simsell" && pp ? String(pp.qty) : ""; tq.limit = String(+S.stocks[el.dataset.id].price.toPrecision(6)); setSub("sim", "handl"); break;
      case "simtrade": var t3 = tk(); t3.sid = el.dataset.id; t3.side = el.dataset.side || "buy"; t3.mode = "qty"; t3.qty = el.dataset.qty || ""; t3.limit = String(+S.stocks[el.dataset.id].price.toPrecision(6)); closeDetail(); S.sub.sim = S.sim ? "handl" : "oversigt"; setTab("sim"); break;
      case "simreset": if (!S.simResetAsk) { S.simResetAsk = true; renderSim(); setTimeout(function () { S.simResetAsk = false; if (S.tab === "sim") renderSim(); }, 4000); break; } S.simResetAsk = false; S.sim = null; S.simB = null; store("kv-sim", ""); if (S.db && S.uid) S.db.doc("data/users/" + S.uid + "/sim").set({ reset: new Date().toISOString() }); S.sub.sim = "oversigt"; renderAll(); toast("Simuleringen er nulstillet"); break;
      case "glclose": hideGloss(); break;
    }
  });
  document.addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.id === "q") { S.f.q = el.value; var pos = el.selectionStart; renderOverview(); var n = $("q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }
    else if (el.id === "pfq") { S.pf_f.q = el.value; var p2 = el.selectionStart; renderProfile(); var n2 = $("pfq"); n2.focus(); try { n2.setSelectionRange(p2, p2); } catch (e) {} }
    else if (el.dataset.act === "slide") {
      var id = el.dataset.id, k = el.dataset.k, val = parseFloat(el.value);
      S.ov[id] = S.ov[id] || {}; S.ov[id][k] = val;
      $("slv-" + k).textContent = pc(val, 1); updateOverride(id);
    } else if (el.dataset.act === "setslide") {
      var k2 = el.dataset.k, v2 = parseFloat(el.value);
      $("slv-" + k2).textContent = k2 === "kellyFraction" ? nf(v2, 2) : pc(v2, k2 === "maxWeight" ? 0 : 2);
    } else if (el.id === "simQty") simUpdate();
    else if (el.id === "calcAmt") calcUpdate(el.dataset.id);
    else if (el.id === "tkQty") { if (tk().mode === "amount") tk().amount = el.value; else tk().qty = el.value; ticketPreview(); }
    else if (el.id === "tkLimit") { tk().limit = el.value; ticketPreview(); }
    else if (el.id === "glq") { S.glq = el.value; var gp = el.selectionStart; renderMethod(); var gq = $("glq"); if (gq) { gq.focus(); try { gq.setSelectionRange(gp, gp); } catch (e) {} } }
  });
  document.addEventListener("change", function (ev) {
    var el = ev.target;
    if (el.id === "sortSel") { S.f.sort = el.value; renderOverview(); }
    else if (el.id === "pfSort") { S.pf_f.sort = el.value; renderProfile(); }
    else if (el.id === "tStock") { S.lastStock = el.value; $("tPrice").value = ""; syncTradeFx(); }
    else if (el.id === "simPos") simUpdate();
    else if (el.id === "tkSid") { var t4 = tk(); t4.sid = el.value; t4.limit = String(+S.stocks[el.value].price.toPrecision(6)); renderSim(); }
    else if (el.id === "tkValid") { tk().validTo = el.value || TODAY; ticketPreview(); }
    else if (el.id === "alStock") { S.lastAlarmStock = el.value; var stA = S.stocks[el.value], ip = $("alPrice2"); if (stA && ip) ip.placeholder = "Kurs nu " + pxs(stA.price) + " " + curL(stA.currency); }
    else if (el.dataset.act === "setslide") { ensureOwnPf(); S.pf.settings[el.dataset.k] = parseFloat(el.value); save(); compute(); renderAll(); }
    else if (el.id === "glOn") { store("kv-gloss", el.checked ? "on" : "off"); toast(el.checked ? "Forklaringer slået til" : "Forklaringer slået fra"); renderAll(); }
    else if (el.id === "anW") { ensureOwnPf(); S.pf.settings.analystWeight = el.checked ? 1 : 0; save(); compute(); renderAll(); }
  });
  document.addEventListener("submit", function (ev) {
    var f = ev.target; ev.preventDefault();
    if (f.id === "tradeForm") {
      var sid = $("tStock").value, st = S.stocks[sid]; if (!st) return;
      var qty = parseFloat($("tQty").value), price = parseFloat($("tPrice").value), fx = st.currency === "DKK" ? 1 : parseFloat($("tFx").value), fee = parseFloat($("tFee").value) || 0, date = $("tDate").value || TODAY, acct = $("tAcct").value;
      if (!(qty > 0) || !(price > 0) || !(fx > 0)) { toast("Udfyld antal, kurs og valutakurs."); return; }
      ensureOwnPf();
      if (S.tradeType === "sell") {
        var have = 0; E.buildPortfolio(S.pf.lots, S.pf.sales, S.stocks, S.macro, {}).positions.forEach(function (p) { if (p.stockId === sid && p.account === acct) have = p.qty; });
        if (qty > have + 1e-9) { toast("Du ejer kun " + nf(have) + " stk. på denne konto."); return; }
      }
      var rec = { id: Math.random().toString(36).slice(2, 10), stockId: sid, account: acct, date: date, qty: qty, price: price, currency: st.currency, fx: fx, fee: fee };
      S.pf[S.tradeType === "sell" ? "sales" : "lots"].push(rec);
      S.lastStock = sid; S.seg.handler = "liste"; save(); compute(); renderAll();
    } else if (f.id === "setForm") {
      ensureOwnPf();
      S.pf.settings.cash = parseFloat($("sCash").value) || 0; S.pf.settings.married = $("sMarried").checked; S.pf.lossCarry = parseFloat($("sCarry").value) || 0;
      save(); compute(); renderAll();
    } else if (f.id === "tkForm") { simSubmit();
    } else if (f.id === "simStartForm") { var c1 = parseFloat($("simCash").value); if (!(c1 >= 1000)) { toast("Startkapitalen skal være mindst 1.000 kr."); return; } simStart(c1); S.sub.sim = "handl"; compute(); renderAll(); toast("Simuleringen er startet med " + kr(c1));
    } else if (f.id === "alarmForm") {
      var pa = parseFloat(($("alPrice").value || "").replace(",", ".")); addAlarm(f.dataset.id, pa); compute(); renderAll();
    } else if (f.id === "alarmForm2") {
      var sA = $("alStock").value, pb = parseFloat(($("alPrice2").value || "").replace(",", ".")); S.lastAlarmStock = sA; addAlarm(sA, pb); compute(); renderAll();
    } else if (f.id === "watchForm") {
      var q = ($("watchQ").value || "").trim(); if (!q) return;
      ensureOwnPf(); S.pf.watch.push({ q: q.slice(0, 60), date: TODAY, status: "afventer" }); save(); renderOverview();
    }
  });
  document.addEventListener("keydown", function (ev) {
    var tg = ev.target && ev.target.tagName;
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.classList && ev.target.classList.contains("gl")) { ev.preventDefault(); showGloss(ev.target.dataset.k, ev.target); return; }
    if (ev.key === "Escape" && $("gpop") && !$("gpop").hidden) { hideGloss(); return; }
    if (ev.key === "Escape" && (S.detail || S.cmpOpen)) closeDetail();
    else if (S.detail && !S.cmpOpen && (ev.key === "ArrowRight" || ev.key === "ArrowLeft") && tg !== "INPUT" && tg !== "SELECT" && tg !== "TEXTAREA") navStep(ev.key === "ArrowRight" ? 1 : -1);
    else if (ev.key === "/" && !S.detail && tg !== "INPUT" && tg !== "TEXTAREA") { ev.preventDefault(); var b = document.querySelector('[data-act="qsearch"]'); if (b) b.click(); }
  });
  (function () {
    var sw = null, sh = $("sheet");
    sh.addEventListener("touchstart", function (e) { if (!S.detail || S.cmpOpen || e.touches.length !== 1 || e.target.closest(".chart,.ladder,input,select,textarea,.scatter")) { sw = null; return; } sw = { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now() }; }, { passive: true });
    sh.addEventListener("touchend", function (e) { if (!sw) return; var p = e.changedTouches[0], dx = p.clientX - sw.x, dy = p.clientY - sw.y, ok = Math.abs(dx) > 70 && Math.abs(dy) < Math.abs(dx) * 0.5 && Date.now() - sw.t < 700; sw = null; if (ok) navStep(dx < 0 ? 1 : -1); }, { passive: true });
  })();
  window.addEventListener("scroll", hideGloss, { passive: true });
  $("sheet").addEventListener("scroll", hideGloss, { passive: true });
  var rT = 0; window.addEventListener("resize", function () { hideGloss(); clearTimeout(rT); rT = setTimeout(function () { if (S.cmpOpen) drawCmpChart(S.cmp.filter(function (x) { return S.A[x]; })); if (S.detail) { if (S.sub.detail === "kurs") drawPriceChart(); if (S.sub.detail === "risiko" && S.seg.risiko === "udfald") drawFan(); } if (S.tab === "profile" && S.sub.profile === "udvikling" && S.seg.udv !== "gt") drawValueChart(S.port.positions); }, 200); });

  function downloadReport() {
    var txt = reportText(), name = "skatterapport-" + YEAR + ".txt";
    if (!S.dl) { toast("Download er ikke tilgængelig her – rapporten er kopieret."); try { navigator.clipboard.writeText(txt); } catch (e) {} return; }
    S.dl.save({ filename: name, data: txt }).then(function () { toast("Rapporten er gemt"); }, function (e) { if (e && e.code === "declined") return; toast("Kunne ikke gemme filen."); });
  }

  // stocks are stored with parallel date/close arrays; rebuild [date, close] pairs for the engine
  function normStock(d) {
    var x = clone(d);
    function zip(D, C) { var out = []; (D || []).forEach(function (dd, i) { if (fin(C[i])) out.push([dd, C[i]]); }); return out; }
    if (!x.monthly) x.monthly = zip(x.monthlyD, x.monthlyC || []);
    if (!x.daily) x.daily = zip(x.dailyD, x.dailyC || []);
    if (!x.monthly.length || !x.daily.length || !fin(x.price) || !x.fund || !x.hist) return null;
    x.est = x.est || {}; x.events = x.events || {}; x.news = x.news || []; x.sources = x.sources || [];
    return x;
  }

  // ---------- boot ----------
  window.__kvToast = toast;
  window.__kvRender = function () { renderAll(); };
  if (window.KV_WORKER) { var rb = $("refreshBtn"); if (rb) rb.hidden = false; }
  applyView();
  if (!load("kv-glhint")) setTimeout(function () { if (Object.keys(S.A).length) { toast("Tip: tryk på ord med prikket understregning for en forklaring"); store("kv-glhint", "1"); } }, 2500);
  try { var savedSub = JSON.parse(load("kv-sub") || "null"); if (savedSub) Object.keys(savedSub).forEach(function (k) { if (S.sub[k] && k !== "detail" && SUBS[k] && SUBS[k].some(function (x) { return x[0] === savedSub[k]; })) { S.sub[k] = savedSub[k]; S.subChosen = true; } }); } catch (e) {}
  var initialTab = (location.hash || "").replace("#", "");
  var tabMap = { overblik: "overview", profil: "profile", skat: "tax", simuler: "sim", metode: "method" };
  var savedTab = load("kv-tab");
  setTab(tabMap[initialTab] || (savedTab && SUBS[savedTab] ? savedTab : "overview"));
  var cached = load("kv-pf");
  function useLocal() { if (cached) { try { S.pf = JSON.parse(cached); S.example = isEmptyPf(S.pf); } catch (e) {} } }
  if (!window.claude || !window.claude.use) { S.dbState = "off"; useLocal(); renderAll(); return; }
  window.claude.use("downloads").then(function (d) { S.dl = d; }, function () {});
  Promise.all([window.claude.use("db"), window.claude.use("user")]).then(function (res) {
    S.db = res[0]; S.user = res[1];
    if (!S.db) { S.dbState = "off"; useLocal(); renderAll(); return; }
    S.dbState = "on";
    var onErr = function (e) { console.warn("db", e && e.code); };
    S.db.collection("stocks").onSnapshot(function (snap) { var o = {}; snap.docs.forEach(function (d) { if (d.exists) { var x = normStock(d.data()); if (x) o[d.id] = x; } }); S.stocks = o; schedule(); }, onErr);
    S.db.doc("meta/status").onSnapshot(function (d) { S.meta = d.exists ? d.data() : null; schedule(); }, onErr);
    S.db.doc("rules/dk").onSnapshot(function (d) { S.rules = d.exists ? d.data() : null; schedule(); }, onErr);
    S.db.doc("macro/current").onSnapshot(function (d) { S.macro = d.exists ? d.data() : null; schedule(); }, onErr);
    (S.user ? S.user.id() : Promise.resolve(null)).then(function (uid) {
      S.uid = uid;
      if (!uid) { useLocal(); schedule(); return; }
      S.db.doc("data/users/" + uid + "/sim").onSnapshot(function (d) {
        if (simSaving) return;
        var x = d.exists ? d.data() : null;
        if (x && x.start && Array.isArray(x.orders)) { S.sim = clone(x); store("kv-sim", JSON.stringify(S.sim)); }
        else if (x && x.reset) { S.sim = null; store("kv-sim", ""); }
        else if (!x && S.sim) flushSim();
        schedule();
      }, onErr);
      S.db.doc("data/users/" + uid + "/prefs").onSnapshot(function (d) {
        if (prefSaving) return;
        if (d.exists) { var pd = d.data() || {}; S.prefs = { fav: Array.isArray(pd.fav) ? pd.fav : [], alarms: Array.isArray(pd.alarms) ? pd.alarms : [] }; store("kv-prefs", JSON.stringify(S.prefs)); }
        else if (S.prefs.fav.length || S.prefs.alarms.length) flushPrefs();
        schedule();
      }, onErr);
      S.db.doc("data/users/" + uid + "/portfolio").onSnapshot(function (d) {
        if (saving) return;
        if (d.exists) { S.pf = clone(d.data()); S.example = isEmptyPf(S.pf); }
        else { S.pf = null; S.example = true; }
        schedule();
      }, onErr);
    });
  }, function () { S.dbState = "off"; useLocal(); renderAll(); });
})();
</script>
